# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    versioning-strategy: increase

  - package-ecosystem: "github-actions"
    directory: "/" # Workflows under .github/workflows
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/" # Dockerfile location
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/scripts/frontend" # Vendored Alpine, Milkdown and Tailwind builds
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      # crepe and plugin-slash share Milkdown/ProseMirror internals and must
      # move together (single bundle, single module graph).
      milkdown:
        patterns:
          - "@milkdown/*"
      # Alpine core and its official plugins share a single version number and
      # must move together.
      alpine:
        patterns:
          - "alpinejs"
          - "@alpinejs/*"
      # Tailwind and the plugins compiled into app.css move as a unit.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
    ignore:
      # Tailwind 4 drops the tailwindcss CLI and the JS config, DaisyUI 5
      # requires Tailwind 4: that migration is a project of its own, not a
      # dependency bump.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "daisyui"
        update-types: ["version-update:semver-major"]
