# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Version updates are weekly and grouped: each bump PR runs the whole test
# pipeline, then again on main once merged, and every merge that touches a
# lockfile rebases (and reruns) the other open bumps. For uv, Actions and
# Docker, the minor and patch updates of the week share one PR and each major
# gets a PR of its own, since a major is the one that may need code changes.
# Groups only apply to version updates (applies-to defaults to
# version-updates), so security updates still arrive one by one, as soon as
# the advisory is published.

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/" # Workflows under .github/workflows
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/" # Dockerfile location
    schedule:
      interval: "weekly"
    groups:
      docker:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/scripts/frontend" # Vendored Alpine, Milkdown and Tailwind builds
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      # crepe and plugin-slash share Milkdown/ProseMirror internals and must
      # move together (single bundle, single module graph).
      milkdown:
        patterns:
          - "@milkdown/*"
      # Alpine core and its official plugins share a single version number and
      # must move together.
      alpine:
        patterns:
          - "alpinejs"
          - "@alpinejs/*"
      # Tailwind and the plugins compiled into app.css move as a unit.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "daisyui"
    ignore:
      # FullCalendar 7 drops the global build we vendor, the luxon3 timezone
      # bridge and every fc-* class the calendar theme targets: a migration of
      # its own, tracked in #1102, not a dependency bump.
      - dependency-name: "fullcalendar"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fullcalendar/*"
        update-types: ["version-update:semver-major"]
