name: Docker

# Only paths that end up in the image (see .dockerignore) or drive the build
# trigger a run. GitHub doesn't apply path filters to tag pushes, so releases
# always build.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '!**.md'
      - 'CHANGELOG.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/docker.yml'
      - '!.claude/**'
      - '!.gitignore'
      - '!workspace/**/tests/**'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'CHANGELOG.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/docker.yml'
      - '!.claude/**'
      - '!.gitignore'
      - '!workspace/**/tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Required so Trivy's SARIF report shows up under Security -> Code scanning.
  security-events: write

env:
  SHOULD_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  # One leg per architecture, each on a runner of that architecture: the image
  # is smoke-tested by being run, which emulation would make either impossible
  # or meaningless. arm64 runners are free for public repositories.
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # Both legs report independently - a broken arm64 build shouldn't hide
      # whether amd64 still passes.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    services:
      # Postgres is only used by the migration smoke step further down,
      # but services on a job spin up unconditionally - that is fine here
      # because the smoke step always runs (it gates the push).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workspace
          POSTGRES_PASSWORD: workspace
          POSTGRES_DB: workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The owner is spelled `JaaJSoft` and a Docker reference may not contain
      # uppercase. metadata-action lowercases what it emits, but the digest push
      # below needs the bare image name, so it gets lowercased here too.
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Changes daily so the Dockerfile's apt layer re-runs and picks up freshly
      # published Debian security patches instead of replaying a stale GHA cache.
      - name: Compute apt cache-bust value
        id: apt_refresh
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: workspace:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
          # Scoped per architecture: the two legs share nothing but the
          # Dockerfile, and an unscoped GHA cache has them overwrite each
          # other's export on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # amd64 only. Both images install the same Debian packages at the same
      # versions, so a second scan reports the same CVEs - and two SARIF uploads
      # sharing a category overwrite one another anyway.
      - name: Scan image for vulnerabilities (Trivy)
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: workspace:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Report only - never fail the build on findings (they surface in
          # the Security tab instead). Bump to e.g. '1' to gate the pipeline.
          exit-code: '0'
        env:
          # Persist the vuln DB across runs so we don't hit GHCR rate limits.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Upload Trivy SARIF to GitHub code scanning
        # always() so results upload even if an earlier step (e.g. smoke) fails.
        if: always() && matrix.arch == 'amd64'
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --frozen

      # The PostgreSQL chain runs in both legs rather than in a job of its own:
      # the container smoke test below needs a migrated, seeded database to talk
      # to, and a service container lives and dies with its job. The legs run in
      # parallel, so duplicating it costs no wall-clock time.
      - name: Initialise SQLite source and seed test data
        run: |
          uv run python manage.py migrate
          uv run python manage.py pg_migration_smoke --seed

      - name: Migrate to PostgreSQL
        run: |
          uv run python manage.py migrate_to_postgres \
            "postgres://workspace:workspace@localhost:5432/workspace"

      - name: Verify migrated data on PostgreSQL
        env:
          DATABASE_URL: postgres://workspace:workspace@localhost:5432/workspace
        run: |
          uv run python manage.py pg_migration_smoke --verify

      - name: Run image against PostgreSQL and smoke HTTP endpoints
        run: |
          # --network host lets the container reach the postgres service
          # mapped on the runner at 127.0.0.1:5432, AND lets the runner
          # curl the gunicorn process at 127.0.0.1:8000.
          docker run -d --name workspace-smoke --network host \
            -e DATABASE_URL=postgres://workspace:workspace@127.0.0.1:5432/workspace \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=127.0.0.1,localhost \
            -e SECRET_KEY=smoke-test-key-not-secret \
            workspace:ci

          trap 'echo "--- container logs ---"; \
                docker logs workspace-smoke 2>&1 || true; \
                docker rm -f workspace-smoke >/dev/null 2>&1 || true' EXIT

          # Wait up to 45s for gunicorn (with gevent workers) to come up.
          for i in $(seq 1 45); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/health/startup; then
              echo "Container ready after ${i}s"
              break
            fi
            sleep 1
          done

          # /health/startup hits the DB (SELECT 1) through the gevent pool.
          # /health/ready hits DB+cache. /login renders a real template
          # against PostgreSQL-backed contenttypes + permissions.
          # drf-orjson-renderer emits compact JSON: {"status":"ok"} with no
          # whitespace, so the regex tolerates both compact and indented forms.
          curl -fsS http://127.0.0.1:8000/health/startup | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'
          curl -fsS http://127.0.0.1:8000/health/ready   | grep -qE '"status"[[:space:]]*:[[:space:]]*"ok"'
          curl -fsS http://127.0.0.1:8000/login          | grep -q '<form'

      - name: Log in to GitHub Container Registry
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Untagged, digest-only: a per-architecture tag would sit in the registry
      # forever, and only the manifest list the publish job assembles should
      # carry a name. Every layer is already in the builder's local cache from
      # the smoke-tested build above, so nothing is rebuilt here - the step
      # exports those same layers to the registry, which is all a push is.
      - name: Push image by digest
        id: push
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APT_REFRESH=${{ steps.apt_refresh.outputs.date }}
          # A provenance attestation is pushed as an extra manifest alongside the
          # image, and `imagetools create` folds it into the list as an entry with
          # no platform. Disabled so the manifest list holds exactly two images.
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The digest is carried as a filename, so the publish job needs no other
      # state to reference the image this leg just pushed.
      - name: Export digest
        if: env.SHOULD_PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.SHOULD_PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the per-architecture digests into one manifest list, so that
  # `docker pull ghcr.io/jaajsoft/workspace:main` resolves to the right image on
  # a Raspberry Pi and on an x86 Kubernetes node alike.
  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    # `env` is not one of the contexts a job-level `if` can read, so the
    # SHOULD_PUSH condition is spelled out again here rather than reused.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Compute the image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Create and push the manifest list
        working-directory: /tmp/digests
        run: |
          # Collected into an array so each tag and digest stays exactly one
          # argument, instead of leaning on word splitting to break them apart.
          args=()
          while IFS= read -r tag; do
            args+=(-t "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do
            args+=("${{ steps.image.outputs.name }}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect the published image
        run: |
          docker buildx imagetools inspect \
            ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
