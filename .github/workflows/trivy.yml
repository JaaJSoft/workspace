# separate terms of service, privacy policy, and support
# documentation.

name: trivy

# Path filters mirror the Docker workflow: the scan runs against a fresh
# image build, so only files that end up in it (see .dockerignore) matter.
# The nightly schedule is unaffected by path filters.
on:
  push:
    branches: [ "main" ]
    paths:
      - '**'
      - '!**.md'
      - 'CHANGELOG.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/trivy.yml'
      - '!.claude/**'
      - '!.gitignore'
      - '!workspace/**/tests/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
    paths:
      - '**'
      - '!**.md'
      - 'CHANGELOG.md'
      - '!docs/**'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/trivy.yml'
      - '!.claude/**'
      - '!.gitignore'
      - '!workspace/**/tests/**'
  schedule:
    - cron: '38 23 * * *'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build an image from Dockerfile
        run: |
          docker build -t docker.io/my-organization/my-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: 'trivy-results.sarif'
