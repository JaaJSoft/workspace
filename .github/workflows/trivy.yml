# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: trivy

# Nightly only. Per-commit scanning already happens in the Docker workflow
# (same severity filter, same SARIF upload) against the image it builds and
# ships, so running it here too just rebuilt the image a second time on every
# push/PR. The schedule is what this workflow is for: catching CVEs published
# between two commits, against a fresh build that picks up new Debian patches.
on:
  schedule:
    - cron: '38 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build an image from Dockerfile
        run: |
          docker build -t workspace:nightly-scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: 'workspace:nightly-scan'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        env:
          # Persist the vuln DB across runs so we don't hit GHCR rate limits.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'
