# Every Workspace service runs the same image with the same environment; only
# PROCESS_TYPE (or the command, for migrate) tells them apart.
x-workspace: &workspace
  # A release tag (ghcr.io/jaajsoft/workspace:0.45.0) keeps upgrades deliberate.
  # Self-built: `docker build -t workspace .` at the repository root, then
  # WORKSPACE_IMAGE=workspace.
  image: ${WORKSPACE_IMAGE:-ghcr.io/jaajsoft/workspace:latest}
  volumes:
    - workspace-data:/app/data
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  environment: &workspace-env
    DEBUG: "0"
    SECRET_KEY: ${SECRET_KEY:-change-me-to-a-real-secret-key}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST:-}
    USE_X_FORWARDED_PORT: ${USE_X_FORWARDED_PORT:-}
    DATABASE_URL: sqlite:////app/data/db.sqlite3
    MEDIA_ROOT: /app/data
    # Cache, sessions and the queue every background task goes through
    REDIS_URL: redis://redis:6379
    GUNICORN_WORKERS: ${GUNICORN_WORKERS:-}
    # Every `celery worker` option reads CELERY_WORKER_<OPTION>: list here the
    # ones you set (see "Processes" in docs/deployments/README.md)
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-}
    CELERY_WORKER_MAX_MEMORY_PER_CHILD: ${CELERY_WORKER_MAX_MEMORY_PER_CHILD:-}
    CELERY_BEAT_SCHEDULE_FILENAME: /app/data/celerybeat-schedule
    WEBPUSH_VAPID_PRIVATE_KEY: ${WEBPUSH_VAPID_PRIVATE_KEY:-}
    WEBPUSH_VAPID_PUBLIC_KEY: ${WEBPUSH_VAPID_PUBLIC_KEY:-}
    WEBPUSH_VAPID_MAILTO: ${WEBPUSH_VAPID_MAILTO:-}
    # Prometheus /metrics - endpoint stays closed until both are set
    METRICS_USER: ${METRICS_USER:-}
    METRICS_PASSWORD: ${METRICS_PASSWORD:-}
    # OAuth2 Mail Providers (optional)
    OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
    OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
    OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
    OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
    # Generic OAuth2 provider (optional, for custom providers)
    OAUTH_GENERIC_CLIENT_ID: ${OAUTH_GENERIC_CLIENT_ID:-}
    OAUTH_GENERIC_CLIENT_SECRET: ${OAUTH_GENERIC_CLIENT_SECRET:-}
    OAUTH_GENERIC_NAME: ${OAUTH_GENERIC_NAME:-}
    OAUTH_GENERIC_AUTH_URL: ${OAUTH_GENERIC_AUTH_URL:-}
    OAUTH_GENERIC_TOKEN_URL: ${OAUTH_GENERIC_TOKEN_URL:-}
    OAUTH_GENERIC_USERINFO_URL: ${OAUTH_GENERIC_USERINFO_URL:-}
    OAUTH_GENERIC_SCOPES: ${OAUTH_GENERIC_SCOPES:-}
    OAUTH_GENERIC_IMAP_HOST: ${OAUTH_GENERIC_IMAP_HOST:-}
    OAUTH_GENERIC_SMTP_HOST: ${OAUTH_GENERIC_SMTP_HOST:-}
    # Bytes of attachments per outgoing email
    MAIL_MAX_ATTACHMENTS_SIZE: ${MAIL_MAX_ATTACHMENTS_SIZE:-26214400}
    # OIDC login / SSO (optional). Run `manage.py oidc_discover <issuer>`
    # to get the four OIDC_OP_* endpoints. Redirect URI: <origin>/oidc/callback
    OIDC_RP_CLIENT_ID: ${OIDC_RP_CLIENT_ID:-}
    OIDC_RP_CLIENT_SECRET: ${OIDC_RP_CLIENT_SECRET:-}
    OIDC_OP_AUTHORIZATION_ENDPOINT: ${OIDC_OP_AUTHORIZATION_ENDPOINT:-}
    OIDC_OP_TOKEN_ENDPOINT: ${OIDC_OP_TOKEN_ENDPOINT:-}
    OIDC_OP_USER_ENDPOINT: ${OIDC_OP_USER_ENDPOINT:-}
    OIDC_OP_JWKS_ENDPOINT: ${OIDC_OP_JWKS_ENDPOINT:-}
    OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OpenID}
    OIDC_RP_SIGN_ALGO: ${OIDC_RP_SIGN_ALGO:-RS256}
    OIDC_RP_SCOPES: ${OIDC_RP_SCOPES:-openid email profile}
    OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
    OIDC_REQUIRE_EMAIL_VERIFIED: ${OIDC_REQUIRE_EMAIL_VERIFIED:-}
    OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
    OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
    OIDC_GROUPS_ALLOWED: ${OIDC_GROUPS_ALLOWED:-}
    # AI (optional)
    AI_API_KEY: ${AI_API_KEY:-}
    AI_BASE_URL: ${AI_BASE_URL:-}
    AI_MODEL: ${AI_MODEL:-gpt-5}
    AI_MAX_TOKENS: ${AI_MAX_TOKENS:-2048}
    AI_CHAT_CONTEXT_SIZE: ${AI_CHAT_CONTEXT_SIZE:-30}
    AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-dall-e-3}
    AI_IMAGE_BASE_URL: ${AI_IMAGE_BASE_URL:-}
    SEARXNG_URL: ${SEARXNG_URL:-}
    # Office documents (optional) - in-browser view/edit via a WOPI editor
    WOPI_DISCOVERY_URL: ${WOPI_DISCOVERY_URL:-}
    WOPI_HOST_URL: ${WOPI_HOST_URL:-}
    # Chat calls (optional) - STUN/TURN servers, see the coturn service below.
    # Set but empty, CHAT_CALL_ICE_SERVERS means no server at all.
    CHAT_CALL_ICE_SERVERS: ${CHAT_CALL_ICE_SERVERS:-stun:stun.l.google.com:19302}
    CHAT_CALL_TURN_SECRET: ${CHAT_CALL_TURN_SECRET:-}
    CHAT_CALL_TURN_TTL: ${CHAT_CALL_TURN_TTL:-21600}
    CHAT_CALL_TURN_USERNAME: ${CHAT_CALL_TURN_USERNAME:-}
    CHAT_CALL_TURN_CREDENTIAL: ${CHAT_CALL_TURN_CREDENTIAL:-}

services:
  web:
    <<: *workspace
    environment:
      <<: *workspace-env
      PROCESS_TYPE: web
    ports:
      - "8000:8000"

  celery-worker:
    <<: *workspace
    environment:
      <<: *workspace-env
      PROCESS_TYPE: worker

  celery-beat:
    <<: *workspace
    environment:
      <<: *workspace-env
      PROCESS_TYPE: beat

  # Applies the migrations, then exits; the services above wait for it to
  # succeed, so a release never serves a schema it has not migrated yet.
  migrate:
    <<: *workspace
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy

  # Holds the task queue, so its data stays on a volume with the append-only
  # file on: a restart keeps the tasks still waiting for the worker.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Web search (optional) - set SEARXNG_URL=http://searxng:8080 to enable
  # All SearXNG config lives in ./searxng/settings.yml
  # searxng:
  #   image: searxng/searxng:latest
  #   volumes:
  #     - ./searxng:/etc/searxng
  #   restart: unless-stopped

  # Office documents (optional) - in-browser view/edit of DOCX/XLSX/PPTX
  # through Collabora CODE (any WOPI editor works; see the README section).
  # The browser loads the editor in an iframe, so Collabora must also be
  # published through your reverse proxy on its own hostname with TLS.
  # Enable with:
  #   WOPI_DISCOVERY_URL=http://collabora:9980/hosting/discovery
  #   WOPI_HOST_URL=http://web:8000
  # collabora:
  #   image: collabora/code:latest
  #   environment:
  #     # Origins allowed to use this editor, dots regex-escaped: the public
  #     # one the browser sees, then the internal one WOPI requests use.
  #     - aliasgroup1=https://workspace\.example\.com:443,http://web:8000
  #     # server_name = the editor's PUBLIC hostname: it is what ends up in
  #     # the discovery XML and iframe URLs the browser must reach.
  #     - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:server_name=collabora.example.com
  #   restart: unless-stopped

  # Calls TURN server (optional) - relays call audio and video for users behind
  # strict NATs or firewalls. It checks credentials derived from the shared
  # secret, so each user's expires on its own. Enable with:
  #   CHAT_CALL_TURN_SECRET=<openssl rand -hex 32>
  #   CHAT_CALL_ICE_SERVERS=stun:turn.example.com:3478,turn:turn.example.com:3478
  # Browsers reach it directly, not through the reverse proxy: open 3478
  # (UDP and TCP) and the relay range 49160-49200/udp on the host's firewall.
  # coturn:
  #   image: coturn/coturn:latest
  #   # Relayed media uses a port per connection: host networking avoids
  #   # publishing the whole range through Docker's proxy.
  #   network_mode: host
  #   command:
  #     - -n
  #     - --log-file=stdout
  #     - --listening-port=3478
  #     - --min-port=49160
  #     - --max-port=49200
  #     - --external-ip=$$(detect-external-ip)
  #     - --realm=turn.example.com
  #     - --use-auth-secret
  #     - --static-auth-secret=${CHAT_CALL_TURN_SECRET}
  #     - --fingerprint
  #     - --no-cli
  #     - --no-multicast-peers
  #     # Never relay to the host or the private network behind it.
  #     - --denied-peer-ip=0.0.0.0-0.255.255.255
  #     - --denied-peer-ip=10.0.0.0-10.255.255.255
  #     - --denied-peer-ip=100.64.0.0-100.127.255.255
  #     - --denied-peer-ip=127.0.0.0-127.255.255.255
  #     - --denied-peer-ip=169.254.0.0-169.254.255.255
  #     - --denied-peer-ip=172.16.0.0-172.31.255.255
  #     - --denied-peer-ip=192.168.0.0-192.168.255.255
  #   restart: unless-stopped

volumes:
  workspace-data:
  redis-data:
