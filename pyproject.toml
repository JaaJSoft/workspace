[project]
name = "workspace"
version = "0.37.0"
description = "Self-hosted productivity suite (files, chat, mail, calendar, notes, AI assistants) designed to run anywhere — from a single Raspberry Pi to a multi-node Kubernetes deployment."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<7.0",
    "djangorestframework==3.18.0",
    "django-filter==26.1",
    "drf-spectacular==0.30.0",
    "drf-orjson-renderer>=1.7.0",
    "django-rest-knox>=5.1.0",
    "whitenoise>=6.11.0",
    "django-redis>=7.0.0",
    "django-unfold>=0.104.1",
    # celery
    "celery>=5.6.2",
    "redis>=8.1.0",
    # C-accelerated RESP parser; redis-py auto-detects and uses it when present
    "hiredis>=3.4.1",
    # imaging
    "pillow>=12.3.0",
    "cairosvg>=2.9.0",
    # mail
    "cryptography>=50.0.0",
    "nh3>=0.3.6",
    "myl-discovery>=0.6.4",
    "icalendar>=7.2.2",
    # utils
    "mistune>=3.3.4",
    "pygments>=2.21.0",
    "dj-database-url>=2.3.0",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    # webdav
    "wsgidav>=4.3.5",
    # server
    "gunicorn>=26.0.0",
    "django-http-compression[brotli]>=1.4.0",
    "gevent>=26.8.0",
    "django-prometheus>=2.5.0",
    # push notifications
    "pywebpush>=2.4.0",
    # oauth2
    "authlib>=1.7.2",
    # file type detection
    "magika>=1.0.0",
    # ai
    "openai>=3.3.1",
    "ollama>=0.6.2",
    # web search & scraping
    "httpx2>=2.10.0",
    "trafilatura>=2.2.0",
    # streaming ZIP generation for bulk downloads (constant RAM)
    "zipstream-ng>=1.9.2",
    "faker>=40.36.0",
    # OpenID Connect (SSO) login
    "mozilla-django-oidc>=5.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "coverage[toml]>=7.15.4",
    "django-debug-toolbar==7.1.1",
    # Fake data generation for scripts/seed_demo.py (dev/demo seeding only).
    # End-to-end / UI tests. Playwright is only needed when E2E=1 is set;
    # otherwise the E2E test cases are skipped (see workspace/common/tests/e2e/).
    "playwright>=1.62.0",
    # Real OpenID Connect provider (RS256 + JWKS + discovery) booted in-process
    # by the OIDC login E2E test, so the SSO flow is exercised end to end.
    "oidc-provider-mock>=0.4.6",
    # Reference implementation of the vault cryptography, used only to generate
    # and verify workspace/vault/tests/crypto_vectors.json. Never imported by
    # application code: the browser owns every real cryptographic operation.
    # argon2-cffi is required for its low-level core(), the only API exposing
    # the Argon2 `secret` parameter (K) the key hierarchy depends on.
    "argon2-cffi>=25.1.0",
    "pyhpke>=0.6.0",
    "cbor2>=5.7.0",
    # Exact pin: the ruff-action CI job auto-discovers this version from
    # pyproject.toml, keeping CI and local runs on the same ruff release.
    "ruff==0.16.4",
    # HTML template linter/formatter (djlint workspace --lint / --reformat).
    "djlint>=1.44.2",
]

[tool.djlint]
profile = "django"
extension = "html"
# Templates are indented with 2 spaces, like the JS and CSS bundles.
indent = 2
max_line_length = 120
# Compared against the combined length of a tag's attributes: a lone class
# list of moderate size stays inline, while a tag carrying several real
# attributes goes vertical (one attribute per line). Attribute values are
# never split, whatever the threshold - a long Alpine expression stays
# intact on its line.
max_attribute_length = 70
single_attribute_per_line = true
# When a tag wraps, its content moves to its own line so the closing tag
# lines up with the opening one, instead of hugging the final ">".
line_break_after_multiline_tag = true
close_void_tags = true
max_blank_lines = 1
format_css = true
format_js = true
# Paired template tags djlint doesn't know: help_items (common/templatetags/
# ui_tags.py) and Django 6's native partialdef.
custom_blocks = "help_items,partialdef"
# D018: hardcoded internal links are widespread in Alpine-driven partials and
#       help dialogs; not worth converting to {% url %} wholesale.
# H019: the static error pages (400/403/404/500) rely on javascript:history.back().
# H021: inline styles carry dynamic widths/positions computed by Alpine.
# H023: typographic entities (&mdash;, &larr;, ...) are used on purpose.
# H030/H031: SEO meta tags are pointless behind a login wall.
ignore = "D018,H019,H021,H023,H030,H031"

# Embedded <style>/<script> blocks follow the same 2-space indent as the HTML.
# (The indent_css/indent_js spellings are CLI-only flags; in config files the
# beautifier settings go through these tables.)
[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
target-version = "py314"
# Django auto-generated code - never linted nor formatted.
extend-exclude = ["**/migrations/**"]

[tool.ruff.format]
# Since 0.16 ruff formats Python code blocks inside Markdown. Our docs rely on
# hand-aligned trailing comments and deliberately invalid snippets to contrast
# correct and incorrect usage, both of which the formatter rewrites.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]
ignore = [
    # Line length is owned by the formatter; E501 would force manual edits of
    # long strings/comments the formatter cannot split.
    "E501",
    # Fixing null=True on string-based fields requires schema migrations on
    # existing models - out of scope for lint adoption. Revisit per field.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Django reads settings as attributes of the package, so the settings modules
# are star-imported into __init__ on purpose.
"workspace/settings/__init__.py" = ["F403"]
# Tests assert generic mock failures (side_effect=Exception) on purpose.
"workspace/*/tests/*" = ["B017"]

[tool.coverage.run]
source = ["workspace"]
branch = true
parallel = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
    "workspace/settings/*",
    "workspace/asgi.py",
    "workspace/wsgi.py",
    "workspace/celery.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
