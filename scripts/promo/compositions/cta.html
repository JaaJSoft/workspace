<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - cta</title>
</head>
<body>
  <template id="cta">
    <div id="cta-root" data-composition-id="cta" data-width="1920" data-height="1080">
      <style>
        #cta-root { position: absolute; inset: 0; }
        /* Half-size 1500 outreaches the frame corners (1101px) at any angle. */
        .cta .rays { position: absolute; left: 50%; top: 50%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px; }
        .cta .rays svg { display: block; width: 100%; height: 100%; }
        .cta .iris { background: var(--mc); clip-path: circle(0% at 50% 50%); }
        .cta .cta-logo { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; }
        .cta .your { position: absolute; left: 0; right: 0; top: 37.5%; text-align: center; font-size: 110px; }
        .cta .title { position: absolute; left: 0; right: 0; top: 52%; text-align: center; font-size: 190px; }
        .cta .tag { position: absolute; left: 0; right: 0; top: 74%; text-align: center; font-size: 64px; }
        .cta .url { position: absolute; left: 0; right: 0; top: 87%; text-align: center; }
        @media (orientation: portrait) {
          .cta .your { top: 38%; font-size: 90px; }
          .cta .title { top: 45%; font-size: 150px; }
          .cta .tag { top: 56%; font-size: 60px; padding: 0 60px; }
          .cta .url { top: 69%; }
        }
      </style>
      <div class="scene cta on-colour" style="--mc: #6d28d9">
        <div class="rays" data-layout-ignore><svg viewBox="-1500 -1500 3000 3000"></svg></div>
        <div class="iris layer"></div>
        <div class="logo cta-logo"><i data-lucide="users"></i></div>
        <div class="slam your">your</div>
        <div class="slam title">Workspace.</div>
        <div class="slam tag">One app for <em>all of it.</em></div>
        <div class="url"><span class="label">github.com/JaaJSoft/workspace</span></div>
      </div>
      <script>
        (() => {
          // The answer to the opening: on the drop the module colours fill
          // the frame as rays and spin faster and faster; the mark lands in
          // the middle, the brand colour irises out of it over the rays, and
          // "your Workspace." builds while the last chord rings.
          const { $, at, PORTRAIT } = window.promo.scene("cta");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });

          // The module scenes' colours, in hue order, one straight ray each.
          const COLOURS = ["#4338ca", "#7e22ce", "#a21caf", "#be185d", "#be123c", "#c2410c", "#b45309", "#65a30d", "#047857", "#0f766e", "#0369a1"];
          const svg = $(".rays svg");
          const width = (2 * Math.PI) / COLOURS.length;
          const corner = (a) => `${(2200 * Math.cos(a)).toFixed(1)} ${(2200 * Math.sin(a)).toFixed(1)}`;
          COLOURS.forEach((colour, i) => {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // A hair wider than its share so neighbours overlap: no seam.
            path.setAttribute("d", `M0 0 L${corner(i * width)} L${corner((i + 1) * width + 0.004)} Z`);
            path.setAttribute("fill", colour);
            svg.appendChild(path);
          });

          // Rays look frozen or reversed past half a ray (16 degrees) a
          // frame at 30 fps: the spin peaks just under that, at the iris.
          tl.fromTo($(".rays"), { rotation: 0 }, { rotation: 620, duration: at(5.5) - at(0), ease: "power2.in" }, at(0));
          pop(tl, $(".cta-logo"), at(4), { duration: 0.45 });
          tl.to($(".iris"), { clipPath: "circle(75% at 50% 50%)", duration: 0.42, ease: "power3.inOut" }, at(5) - 0.2);
          // The mark rises to the lockup as the words come in under it.
          tl.to($(".cta-logo"), { y: PORTRAIT ? -0.19 * 1920 : -0.24 * 1080, duration: 0.45, ease: "power3.inOut" }, at(5.5));
          slam(tl, $(".your"), at(6), "drop");
          slam(tl, $(".title"), at(6.5), "scale");
          slam(tl, $(".tag"), at(8), "rise");
          slam(tl, $(".url"), at(10), "drop");
          window.__timelines["cta"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
