<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - cta</title>
</head>
<body>
  <template id="cta">
    <div id="cta-root" data-composition-id="cta" data-width="1920" data-height="1080">
      <style>
        #cta-root { position: absolute; inset: 0; }
        .cta .arm { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
        .cta .arm .app-icon { left: 0; top: 0; width: 130px; height: 130px; margin: -65px 0 0 -65px; }
        .cta .arm .app-icon svg { width: 64px; height: 64px; }
        .cta .cta-logo { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; }
        .cta .ring { position: absolute; inset: -6px; border-radius: 30%; border: 6px solid #fff; opacity: 0; }
        .cta .title { position: absolute; left: 0; right: 0; top: 52%; text-align: center; font-size: 190px; }
        .cta .tag { position: absolute; left: 0; right: 0; top: 74%; text-align: center; font-size: 64px; }
        .cta .url { position: absolute; left: 0; right: 0; top: 87%; text-align: center; }
        @media (orientation: portrait) {
          .cta .title { top: 44%; font-size: 150px; }
          .cta .tag { top: 55%; font-size: 60px; padding: 0 60px; }
          .cta .url { top: 68%; }
        }
      </style>
      <div class="scene cta">
        <div class="arm"><div class="app-icon" style="--tile: #6d28d9"><i data-lucide="search"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #4338ca"><i data-lucide="hard-drive"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #65a30d"><i data-lucide="images"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #047857"><i data-lucide="notebook-pen"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #0369a1"><i data-lucide="message-circle"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #be185d"><i data-lucide="sparkles"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #b45309"><i data-lucide="mail"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #0f766e"><i data-lucide="calendar"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #c2410c"><i data-lucide="square-kanban"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #be123c"><i data-lucide="contact"></i></div></div>
        <div class="arm"><div class="app-icon" style="--tile: #7e22ce"><i data-lucide="key-round"></i></div></div>
        <div class="logo cta-logo"><i data-lucide="users"></i><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
        <div class="slam title">Workspace</div>
        <div class="slam tag">One app. Every tool. <em>Yours.</em></div>
        <div class="url"><span class="label">github.com/JaaJSoft/workspace</span></div>
      </div>
      <script>
        (() => {
          // logo-assemble-lockup, flat: on the drop every module bursts out
          // of the centre, circles, and collapses back into the mark; the
          // mark then rises to the lockup, which holds while the last chord rings.
          const { $, $$, at, PORTRAIT } = window.promo.scene("cta");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });
          const arms = $$(".arm");
          // Tile half-size 65 + a margin: the wheel never touches the frame edge.
          const radius = 380;
          // The wheel turns around the frame centre; the lockup sits higher.
          const lift = PORTRAIT ? -0.16 * 1920 : -0.14 * 1080;
          arms.forEach((arm, i) => {
            const base = (i / arms.length) * 360;
            const icon = arm.firstElementChild;
            // The arm turns and the tile turns back by as much: icons stay upright.
            tl.fromTo(arm, { rotation: base }, { rotation: base + 140, duration: at(5), ease: "power1.in" }, 0);
            tl.fromTo(icon, { rotation: -base }, { rotation: -base - 140, duration: at(5), ease: "power1.in" }, 0);
            tl.fromTo(icon, { x: 0, scale: 0.2, opacity: 0 }, { x: radius, scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, at(0) + i * 0.03);
            tl.to(icon, { x: 0, scale: 0.3, duration: 0.5, ease: "power3.in" }, at(4.2));
            tl.to(icon, { opacity: 0, duration: 0.12, ease: "none" }, at(5) - 0.12);
          });
          pop(tl, $(".cta-logo"), at(5), { duration: 0.6 });
          tl.to($(".cta-logo"), { y: lift, duration: 0.4, ease: "power3.inOut" }, at(6) - 0.25);
          $$(".ring").forEach((ring, i) => {
            tl.fromTo(ring, { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 1.0, ease: "power3.out" }, at(5.2 + i));
          });
          slam(tl, $(".title"), at(6), "scale");
          slam(tl, $(".tag"), at(8), "rise");
          slam(tl, $(".url"), at(10), "drop");
          window.__timelines["cta"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
