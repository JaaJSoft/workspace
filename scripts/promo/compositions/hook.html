<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - hook</title>
</head>
<body>
  <template id="hook">
    <div id="hook-root" data-composition-id="hook" data-width="1920" data-height="1080">
      <style>
        #hook-root { position: absolute; inset: 0; }
        .hook .mega { position: absolute; left: 0; right: 0; top: 50%; opacity: 0; }
        .hook .m0 { margin-top: -220px; font-size: 170px; }
        .hook .m1, .hook .m2, .hook .m3 { margin-top: -110px; }
        @media (orientation: portrait) {
          .hook .m0 { margin-top: -130px; font-size: 100px; }
          .hook .m1, .hook .m2, .hook .m3 { margin-top: -70px; }
        }
      </style>
      <div class="scene hook">
        <div class="panel" style="--tile: #4f46e5"><div class="panel-icon"><i data-lucide="hard-drive"></i></div><div class="slam big">Your files,</div></div>
        <div class="panel" style="--tile: #0369a1"><div class="panel-icon"><i data-lucide="message-circle"></i></div><div class="slam big">your chat,</div></div>
        <div class="panel" style="--tile: #b45309"><div class="panel-icon"><i data-lucide="mail"></i></div><div class="slam big">your mail,</div></div>
        <div class="panel" style="--tile: #c2410c"><div class="panel-icon"><i data-lucide="square-kanban"></i></div><div class="slam big">your tasks,</div></div>
        <div class="panel" style="--tile: #7e22ce"><div class="panel-icon"><i data-lucide="key-round"></i></div><div class="slam big">your passwords</div></div>

        <div class="pile layer">
          <div class="app-icon" style="--tile: #6366f1"><i data-lucide="hard-drive"></i><span class="badge" data-layout-allow-overlap>12</span></div>
          <div class="app-icon" style="--tile: #0ea5e9"><i data-lucide="message-circle"></i><span class="badge" data-layout-allow-overlap>38</span></div>
          <div class="app-icon" style="--tile: #f59e0b"><i data-lucide="mail"></i><span class="badge" data-layout-allow-overlap>99+</span></div>
          <div class="app-icon" style="--tile: #14b8a6"><i data-lucide="calendar"></i><span class="badge" data-layout-allow-overlap>4</span></div>
          <div class="app-icon" style="--tile: #10b981"><i data-lucide="notebook-pen"></i><span class="badge" data-layout-allow-overlap>7</span></div>
          <div class="app-icon" style="--tile: #f97316"><i data-lucide="square-kanban"></i><span class="badge" data-layout-allow-overlap>23</span></div>
          <div class="app-icon" style="--tile: #f43f5e"><i data-lucide="contact"></i><span class="badge" data-layout-allow-overlap>2</span></div>
          <div class="app-icon" style="--tile: #84cc16"><i data-lucide="images"></i><span class="badge" data-layout-allow-overlap>51</span></div>
          <div class="app-icon" style="--tile: #a855f7"><i data-lucide="key-round"></i><span class="badge" data-layout-allow-overlap>1</span></div>
        </div>

        <div class="slam mega m0"><div>&hellip;in nine</div><div><em>different apps.</em></div></div>
        <div class="slam mega m1">9 logins.</div>
        <div class="slam mega m2">9 tabs.</div>
        <div class="slam mega m3"><em>0 overview.</em></div>
      </div>
      <script>
        (() => {
          // kinetic-beat-slam: five full-bleed hard cuts, one per beat, a
          // distinct entrance each; then overwhelm-surround, the clutter
          // variant: loud app icons pile up, badges and all, under the count.
          const { $$, at, pile } = window.promo.scene("hook");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });

          const panels = $$(".panel");
          const kinds = ["scale", "left", "rise", "right", "drop"];
          panels.forEach((panel, i) => {
            tl.set(panel, { opacity: 1 }, at(i));
            if (i) tl.set(panels[i - 1], { opacity: 0 }, at(i));
            slam(tl, panel.querySelector(".big"), at(i), kinds[i]);
            pop(tl, panel.querySelector(".panel-icon"), at(i), { rotation: i % 2 ? 18 : -18, duration: 0.4 });
          });
          tl.set(panels[panels.length - 1], { opacity: 0 }, at(5));

          // The pile's spots are shared with the intro, which pulls the same
          // icons out of them: resting positions, set once, never tweened.
          const icons = $$(".app-icon");
          icons.forEach((icon, i) => {
            const [x, y, rotation] = pile[i];
            icon.style.left = `${x}px`;
            icon.style.top = `${y}px`;
            tl.fromTo(icon, { scale: 0, opacity: 0, rotation: rotation * 3 }, { scale: 1, opacity: 1, rotation, duration: 0.4, ease: "back.out(2.4)" }, at(5.5 + i * 0.5));
            pop(tl, icon.querySelector(".badge"), at(5.7 + i * 0.5), { duration: 0.35 });
          });

          const mega = $$(".mega");
          const swaps = [5, 8, 9.5, 11];
          const entrances = ["scale", "left", "right", "scale"];
          mega.forEach((line, i) => {
            slam(tl, line, at(swaps[i]), entrances[i]);
            if (!i) return;
            // zoom-through swap: the old count rushes at the camera and cuts
            tl.to(mega[i - 1], { scale: 1.25, filter: "blur(10px)", duration: 0.16, ease: "power3.in" }, at(swaps[i]) - 0.16);
            tl.to(mega[i - 1], { opacity: 0, duration: 0.16, ease: "none" }, at(swaps[i]) - 0.16);
          });

          // chromatic-glitch on the last count while the pile shakes loose
          const last = mega[mega.length - 1];
          tl.set(last, { textShadow: "9px 0 #ff4fa3, -9px 0 #22d3ee, 0 12px 60px rgb(14 10 22 / .9)" }, at(13));
          tl.fromTo(last, { x: 0 }, { x: 16, duration: 0.05, ease: "steps(1)", yoyo: true, repeat: 11 }, at(13));
          tl.set(last, { textShadow: "0 12px 60px rgb(14 10 22 / .9)" }, at(14.5));
          icons.forEach((icon, i) => {
            tl.fromTo(icon, { x: 0, y: 0 }, { x: i % 2 ? 14 : -14, y: i % 3 ? 10 : -10, duration: 0.06, ease: "steps(1)", yoyo: true, repeat: 19 }, at(13));
          });
          window.__timelines["hook"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
