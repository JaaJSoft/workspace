<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - hook</title>
</head>
<body>
  <template id="hook">
    <div id="hook-root" data-composition-id="hook" data-width="1920" data-height="1080">
      <style>
        #hook-root { position: absolute; inset: 0; }
        .hook .hook-lines { position: absolute; left: 0; right: 0; top: 50%; height: 180px; margin-top: -90px; }
        .hook .hook-line { position: absolute; left: 0; right: 0; text-align: center; font-size: 124px; white-space: nowrap; }
        .hook .app-tile:nth-of-type(1) { left: 110px; top: 70px; --tile: #818cf8; }
        .hook .app-tile:nth-of-type(2) { left: 560px; top: 40px; --tile: #38bdf8; }
        .hook .app-tile:nth-of-type(3) { left: 1160px; top: 40px; --tile: #fbbf24; }
        .hook .app-tile:nth-of-type(4) { left: 1610px; top: 70px; --tile: #2dd4bf; }
        .hook .app-tile:nth-of-type(5) { left: 40px; top: 440px; --tile: #34d399; }
        .hook .app-tile:nth-of-type(6) { left: 1680px; top: 440px; --tile: #fb923c; }
        .hook .app-tile:nth-of-type(7) { left: 330px; top: 810px; --tile: #fb7185; }
        .hook .app-tile:nth-of-type(8) { left: 860px; top: 840px; --tile: #a3e635; }
        .hook .app-tile:nth-of-type(9) { left: 1390px; top: 810px; --tile: #c084fc; }
        @media (orientation: portrait) {
          .hook .hook-line { font-size: 92px; }
          .hook .app-tile { width: 170px; height: 170px; border-radius: 38px; font-size: 20px; }
          .hook .app-tile svg { width: 60px; height: 60px; }
          .hook .app-tile:nth-of-type(1) { left: 70px; top: 200px; }
          .hook .app-tile:nth-of-type(2) { left: 455px; top: 170px; }
          .hook .app-tile:nth-of-type(3) { left: 840px; top: 200px; }
          .hook .app-tile:nth-of-type(4) { left: 250px; top: 460px; }
          .hook .app-tile:nth-of-type(5) { left: 660px; top: 460px; }
          .hook .app-tile:nth-of-type(6) { left: 70px; top: 1300px; }
          .hook .app-tile:nth-of-type(7) { left: 455px; top: 1330px; }
          .hook .app-tile:nth-of-type(8) { left: 840px; top: 1300px; }
          .hook .app-tile:nth-of-type(9) { left: 455px; top: 1580px; }
        }
      </style>
      <div class="scene hook">
        <div class="app-tile"><i data-lucide="hard-drive"></i><span>Drive</span></div>
        <div class="app-tile"><i data-lucide="message-circle"></i><span>Chat</span></div>
        <div class="app-tile"><i data-lucide="mail"></i><span>Mail</span></div>
        <div class="app-tile"><i data-lucide="calendar"></i><span>Calendar</span></div>
        <div class="app-tile"><i data-lucide="notebook-pen"></i><span>Notes</span></div>
        <div class="app-tile"><i data-lucide="square-kanban"></i><span>Tasks</span></div>
        <div class="app-tile"><i data-lucide="contact"></i><span>Contacts</span></div>
        <div class="app-tile"><i data-lucide="images"></i><span>Photos</span></div>
        <div class="app-tile"><i data-lucide="key-round"></i><span>Passwords</span></div>
        <div class="hook-lines">
          <div class="slam hook-line">Files <em>here.</em></div>
          <div class="slam hook-line">Chat <em>there.</em></div>
          <div class="slam hook-line">Mail? <em>Elsewhere.</em></div>
          <div class="slam hook-line">Nine <em>apps.</em></div>
          <div class="slam hook-line">Nine <em>logins.</em></div>
          <div class="slam hook-line">Nine <em>bills.</em></div>
        </div>
      </div>
      <script>
        (() => {
          // overwhelm-surround (tools pile in around the viewer's attention)
          // + kinetic-beat-slam (pain lines land alone, one per beat pair).
          const { $$, at, PORTRAIT } = window.promo.scene("hook");
          const { slam, pop, drift, prng } = window.promo;
          const tl = gsap.timeline({ paused: true });

          const lines = $$(".hook-line");
          const beats = [1, 3, 5, 8, 10, 12];
          const kinds = ["scale", "left", "rise", "drop", "right", "scale"];
          lines.forEach((line, i) => {
            slam(tl, line, at(beats[i]), kinds[i]);
            if (!i) return;
            // zoom-through swap: the old line rushes at the camera and cuts
            const prev = lines[i - 1];
            tl.to(prev, { scale: 1.2, filter: "blur(10px)", duration: 0.18, ease: "power3.in" }, at(beats[i]) - 0.18);
            tl.to(prev, { opacity: 0, duration: 0.18, ease: "none" }, at(beats[i]) - 0.18);
          });

          const rand = prng(3);
          const tiles = $$(".app-tile");
          tiles.forEach((tile, i) => {
            pop(tl, tile, at(1 + i * 1.2), { rotation: (rand() - 0.5) * 40 });
            drift(tl, tile, at(2 + i * 1.2), at(14), { y: 10 + rand() * 8 }, 1.6 + rand());
          });

          // The pile closes in on the words, and the frame glitches.
          const last = lines[lines.length - 1];
          tiles.forEach((tile, i) => {
            const style = getComputedStyle(tile);
            const cx = parseFloat(style.left) + tile.offsetWidth / 2;
            const cy = parseFloat(style.top) + tile.offsetHeight / 2;
            const w = PORTRAIT ? 1080 : 1920;
            const h = PORTRAIT ? 1920 : 1080;
            tl.to(tile, { x: (w / 2 - cx) * 0.3, y: (h / 2 - cy) * 0.3, rotation: (rand() - 0.5) * 24, duration: 0.8, ease: "power2.in" }, at(14));
          });
          tl.set(last, { textShadow: "8px 0 #ff4fa3, -8px 0 #22d3ee" }, at(14));
          tl.to(last, { x: 14, duration: 0.05, ease: "steps(1)", yoyo: true, repeat: 7 }, at(14));
          tl.set(last, { textShadow: "none" }, at(15));
          window.__timelines["hook"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
