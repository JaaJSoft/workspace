<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - intro</title>
</head>
<body>
  <template id="intro">
    <div id="intro-root" data-composition-id="intro" data-width="1920" data-height="1080">
      <style>
        #intro-root { position: absolute; inset: 0; }
        .intro .world { position: absolute; inset: 0; }
        .intro .intro-logo { position: absolute; left: 50%; top: 31%; width: 230px; height: 230px; margin: -115px 0 0 -115px; }
        .intro .intro-ring { position: absolute; inset: -6px; border-radius: 30%; border: 5px solid #ff4fa3; opacity: 0; }
        .intro .burst { position: absolute; left: 50%; top: 31%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, rgb(255 79 163 / .55), rgb(255 79 163 / 0) 60%); opacity: 0; }
        .intro .intro-title { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 230px; }
        .intro .one { position: absolute; left: 0; right: 0; top: 74%; text-align: center; font-size: 84px; }
        @media (orientation: portrait) {
          .intro .intro-logo, .intro .burst { top: 33%; }
          .intro .intro-title { top: 43%; font-size: 150px; }
          .intro .one { top: 56%; font-size: 76px; }
        }
      </style>
      <div class="scene intro">
        <div class="world">
          <div class="burst"></div>
          <div class="app-icon intro-icon" style="--tile: #6366f1"><i data-lucide="hard-drive"></i><span class="badge" data-layout-allow-overlap>12</span></div>
          <div class="app-icon intro-icon" style="--tile: #0ea5e9"><i data-lucide="message-circle"></i><span class="badge" data-layout-allow-overlap>38</span></div>
          <div class="app-icon intro-icon" style="--tile: #f59e0b"><i data-lucide="mail"></i><span class="badge" data-layout-allow-overlap>99+</span></div>
          <div class="app-icon intro-icon" style="--tile: #14b8a6"><i data-lucide="calendar"></i><span class="badge" data-layout-allow-overlap>4</span></div>
          <div class="app-icon intro-icon" style="--tile: #10b981"><i data-lucide="notebook-pen"></i><span class="badge" data-layout-allow-overlap>7</span></div>
          <div class="app-icon intro-icon" style="--tile: #f97316"><i data-lucide="square-kanban"></i><span class="badge" data-layout-allow-overlap>23</span></div>
          <div class="app-icon intro-icon" style="--tile: #f43f5e"><i data-lucide="contact"></i><span class="badge" data-layout-allow-overlap>2</span></div>
          <div class="app-icon intro-icon" style="--tile: #84cc16"><i data-lucide="images"></i><span class="badge" data-layout-allow-overlap>51</span></div>
          <div class="app-icon intro-icon" style="--tile: #a855f7"><i data-lucide="key-round"></i><span class="badge" data-layout-allow-overlap>1</span></div>
          <div class="logo intro-logo"><i data-lucide="users"></i><div class="intro-ring"></div><div class="intro-ring"></div><div class="intro-ring"></div></div>
          <div class="slam intro-title">Workspace</div>
          <div class="slam one">One app. <em>For everything.</em></div>
        </div>
      </div>
      <script>
        (() => {
          // logo-assemble-lockup: the hook's pile, from the very spots it was
          // left in, collapses into the mark; the burst lands the name.
          const { $, $$, at, end, pile, PORTRAIT } = window.promo.scene("intro");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });

          const cx = PORTRAIT ? 540 : 960;
          const cy = PORTRAIT ? 634 : 335;
          $$(".intro-icon").forEach((icon, i) => {
            const [x, y, rotation] = pile[i];
            icon.style.left = `${x}px`;
            icon.style.top = `${y}px`;
            tl.fromTo(
              icon,
              { x: 0, y: 0, rotation, scale: 1, opacity: 1 },
              { x: cx - x, y: cy - y, rotation: rotation + 180, scale: 0.25, opacity: 0, duration: 0.5, ease: "power3.in" },
              at(0) + i * 0.025,
            );
          });
          tl.fromTo($(".burst"), { scale: 0.2, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.9, ease: "expo.out" }, at(1.1));
          pop(tl, $(".intro-logo"), at(1.1), { rotation: -120, duration: 0.7 });
          $$(".intro-ring").forEach((ring, i) => {
            tl.fromTo(ring, { scale: 1, opacity: 0.9 }, { scale: 2.8, opacity: 0, duration: 1.0, ease: "power3.out" }, at(1.3 + i * 2));
          });
          slam(tl, $(".intro-title"), at(2), "scale");
          slam(tl, $(".one"), at(4), "rise");
          // the camera leans in under the riser
          tl.fromTo($(".world"), { scale: 1 }, { scale: 1.07, duration: end - at(2), ease: "power2.in" }, at(2));
          window.__timelines["intro"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
