<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - open</title>
</head>
<body>
  <template id="open">
    <div id="open-root" data-composition-id="open" data-width="1920" data-height="1080">
      <style>
        #open-root { position: absolute; inset: 0; }
        .open .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; background: var(--mc); opacity: 0; }
        .open .panel-icon { width: 210px; height: 210px; color: #fff; }
        .open .panel-icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
        .open .panel .slam { font-size: 170px; }
        @media (orientation: portrait) {
          .open .panel .slam { font-size: 110px; }
          .open .panel-icon { width: 180px; height: 180px; }
        }
      </style>
      <div class="scene open on-colour">
        <div class="panel" style="--mc: #4338ca"><div class="panel-icon"><i data-lucide="hard-drive"></i></div><div class="slam">Your files,</div></div>
        <div class="panel" style="--mc: #c2410c"><div class="panel-icon"><i data-lucide="square-kanban"></i></div><div class="slam">your projects,</div></div>
        <div class="panel" style="--mc: #0369a1"><div class="panel-icon"><i data-lucide="message-circle"></i></div><div class="slam">your chats,</div></div>
        <div class="panel" style="--mc: #b45309"><div class="panel-icon"><i data-lucide="mail"></i></div><div class="slam">your mail,</div></div>
      </div>
      <script>
        (() => {
          // kinetic-beat-slam: the hook, four full-bleed hard cuts in the
          // modules' colours, one per beat. The rush picks up from here and
          // the drop answers it with the app itself.
          const { $$, at } = window.promo.scene("open");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });
          const panels = $$(".panel");
          const kinds = ["scale", "left", "rise", "right"];
          panels.forEach((panel, i) => {
            tl.set(panel, { opacity: 1 }, at(i));
            if (i) tl.set(panels[i - 1], { opacity: 0 }, at(i));
            slam(tl, panel.querySelector(".slam"), at(i), kinds[i]);
            pop(tl, panel.querySelector(".panel-icon"), at(i), { rotation: i % 2 ? 18 : -18, duration: 0.35 });
          });
          window.__timelines["open"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
