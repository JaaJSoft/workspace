<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - open</title>
</head>
<body>
  <template id="open">
    <div id="open-root" data-composition-id="open" data-width="1920" data-height="1080">
      <style>
        #open-root { position: absolute; inset: 0; }
        .open .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; background: var(--mc); opacity: 0; }
        .open .panel-icon { width: 210px; height: 210px; color: #fff; }
        .open .panel-icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
        .open .panel .slam { font-size: 170px; }
        .open .stripes { position: absolute; inset: 0; display: flex; }
        .open .stripe { flex: 1; height: 100%; background: var(--mc); }
        .open .open-logo { position: absolute; left: 50%; top: 30%; width: 230px; height: 230px; margin: -115px 0 0 -115px; }
        .open .ring { position: absolute; inset: -6px; border-radius: 30%; border: 6px solid #fff; opacity: 0; }
        .open .your { position: absolute; left: 0; right: 0; top: 44%; text-align: center; font-size: 110px; }
        .open .ws { position: absolute; left: 0; right: 0; top: 59%; text-align: center; font-size: 210px; }
        .open .one { position: absolute; left: 0; right: 0; top: 85%; text-align: center; }
        @media (orientation: portrait) {
          .open .panel .slam { font-size: 110px; }
          .open .panel-icon { width: 180px; height: 180px; }
          .open .open-logo { top: 32%; }
          .open .your { top: 43%; font-size: 90px; }
          .open .ws { top: 50.5%; font-size: 150px; }
          .open .one { top: 62%; padding: 0 60px; }
        }
      </style>
      <div class="scene open on-colour">
        <div class="panel" style="--mc: #4338ca"><div class="panel-icon"><i data-lucide="hard-drive"></i></div><div class="slam">Your files,</div></div>
        <div class="panel" style="--mc: #c2410c"><div class="panel-icon"><i data-lucide="square-kanban"></i></div><div class="slam">your projects,</div></div>
        <div class="panel" style="--mc: #0369a1"><div class="panel-icon"><i data-lucide="message-circle"></i></div><div class="slam">your chats,</div></div>
        <div class="panel" style="--mc: #7e22ce"><div class="panel-icon"><i data-lucide="database"></i></div><div class="slam">your data.</div></div>
        <div class="stripes">
          <div class="stripe" style="--mc: #4338ca"></div>
          <div class="stripe" style="--mc: #c2410c"></div>
          <div class="stripe" style="--mc: #0369a1"></div>
          <div class="stripe" style="--mc: #7e22ce"></div>
        </div>
        <div class="logo open-logo"><i data-lucide="users"></i><div class="ring"></div><div class="ring"></div></div>
        <div class="slam your">your</div>
        <div class="slam ws">Workspace.</div>
        <div class="slam one" style="font-size: 64px">One app for <em style="color: #ff4fa3">all of it.</em></div>
      </div>
      <script>
        (() => {
          // kinetic-beat-slam: four full-bleed hard cuts, one per beat, then
          // the four colours slam in as stripes and squeeze into the mark
          // (logo-assemble-lockup): all of those are yours, in one place.
          const { $, $$, at } = window.promo.scene("open");
          const { slam, pop } = window.promo;
          const tl = gsap.timeline({ paused: true });

          const panels = $$(".panel");
          const kinds = ["scale", "left", "rise", "right"];
          panels.forEach((panel, i) => {
            tl.set(panel, { opacity: 1 }, at(i));
            if (i) tl.set(panels[i - 1], { opacity: 0 }, at(i));
            slam(tl, panel.querySelector(".slam"), at(i), kinds[i]);
            pop(tl, panel.querySelector(".panel-icon"), at(i), { rotation: i % 2 ? 18 : -18, duration: 0.35 });
          });

          const stripes = $$(".stripe");
          stripes.forEach((stripe, i) => {
            tl.fromTo(stripe, { yPercent: i % 2 ? 100 : -100 }, { yPercent: 0, duration: 0.28, ease: "power4.out" }, at(4) + i * 0.04);
          });
          tl.set(panels[panels.length - 1], { opacity: 0 }, at(4) + 0.3);
          // the four colours squeeze into one mark
          tl.to($(".stripes"), { scaleX: 0.12, scaleY: 0.2, y: -150, duration: 0.35, ease: "power4.in" }, at(5));
          tl.set($(".stripes"), { opacity: 0 }, at(5) + 0.35);
          pop(tl, $(".open-logo"), at(5) + 0.3, { rotation: -90, duration: 0.55 });
          $$(".ring").forEach((ring, i) => {
            tl.fromTo(ring, { scale: 1, opacity: 1 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power3.out" }, at(5.6 + i));
          });
          slam(tl, $(".your"), at(6), "drop");
          slam(tl, $(".ws"), at(6.5), "scale");
          slam(tl, $(".one"), at(8), "rise");
          window.__timelines["open"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
