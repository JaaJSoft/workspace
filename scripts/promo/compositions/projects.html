<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - projects</title>
</head>
<body>
  <template id="projects">
    <div id="projects-root" data-composition-id="projects" data-width="1920" data-height="1080">
      <style>
        #projects-root { position: absolute; inset: 0; }
        .projects.scene { perspective: 2200px; }
        .projects .copy { position: absolute; left: 1120px; top: 300px; width: 720px; }
        .projects .copy .slam { font-size: 124px; }
        .projects .copy .label { margin-bottom: 28px; }
        .projects .copy .sub { margin-top: 36px; }
        .projects .win { left: 80px; top: 212px; width: 980px; height: 656px; }
        @media (orientation: portrait) {
          .projects .copy { left: 80px; top: 1180px; width: 920px; }
          .projects .win { left: 40px; top: 300px; width: 1000px; height: 669px; }
        }
      </style>
      <div class="scene projects">
        <div class="win">
          <div class="win-bar"><i></i><i></i><i></i><span>workspace.example.com/<b>projects</b></span></div>
          <div class="win-screen">
            <video id="projects-take" data-hf-media-start-basis="local" src="assets/clips/projects-0.mp4" muted playsinline data-start="0.3" data-duration="4.05" data-media-start="0.6" data-playback-rate="1.6" data-track-index="4"></video>
          </div>
        </div>
        <div class="copy">
          <div class="label">02 &middot; Kanban boards</div>
          <div class="slam s1">Move work</div>
          <div class="slam s2"><em>forward.</em></div>
          <div class="sub">Drag, drop, done. Your team sees it live.</div>
        </div>
      </div>
      <script>
        (() => {
          // cursor-ui-demo, mirrored: the window takes the left wing this time.
          const { $, at, end } = window.promo.scene("projects");
          const { slam, windowIn, drift } = window.promo;
          const tl = gsap.timeline({ paused: true });
          windowIn(tl, $(".win"), at(0) - 0.1, -1);
          drift(tl, $(".win"), at(1.5), end, { y: 10 }, 2.2);
          slam(tl, $(".label"), at(0), "right");
          slam(tl, $(".s1"), at(0), "right");
          slam(tl, $(".s2"), at(1), "drop");
          slam(tl, $(".sub"), at(4), "rise");
          window.__timelines["projects"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
