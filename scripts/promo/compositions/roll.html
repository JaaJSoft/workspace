<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - roll</title>
</head>
<body>
  <template id="roll">
    <div id="roll-root" data-composition-id="roll" data-width="1920" data-height="1080">
      <style>
        #roll-root { position: absolute; inset: 0; }
        .roll .panel { position: absolute; inset: 0; display: grid; place-items: center; background: var(--mc); opacity: 0; }
        .roll .panel-icon { width: 260px; height: 260px; color: #fff; }
        .roll .panel-icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
        @media (orientation: portrait) {
          .roll .panel-icon { width: 220px; height: 220px; }
        }
      </style>
      <div class="scene roll"></div>
      <script>
        (() => {
          // The build into the drop: every module again, full screen in its
          // colour, one per hit, the hits tightening from beats to
          // sixteenths like the clap roll under them.
          const { el, $$, at, hits, BEAT } = window.promo.scene("roll");
          const tl = gsap.timeline({ paused: true });

          // The module scenes, in playing order.
          const MODULES = [
            ["#a21caf", "search"], ["#4338ca", "hard-drive"], ["#0369a1", "message-circle"],
            ["#be185d", "sparkles"], ["#c2410c", "square-kanban"], ["#047857", "notebook-pen"],
            ["#b45309", "mail"], ["#0f766e", "calendar"], ["#be123c", "contact"],
            ["#7e22ce", "key-round"], ["#65a30d", "images"],
          ];
          const stage = el.querySelector(".scene");
          hits.forEach((_, i) => {
            const [colour, icon] = MODULES[i % MODULES.length];
            stage.insertAdjacentHTML("beforeend", `<div class="panel" style="--mc: ${colour}"><div class="panel-icon"><i data-lucide="${icon}"></i></div></div>`);
          });
          lucide.createIcons({ icons: lucide.icons });

          const panels = $$(".panel");
          hits.forEach((hit, i) => {
            const gap = (hits[i + 1] ?? hit + 1) - hit;
            tl.set(panels[i], { opacity: 1 }, at(hit));
            if (i) tl.set(panels[i - 1], { opacity: 0 }, at(hit));
            tl.fromTo(panels[i].firstElementChild, { scale: 1.35 }, { scale: 1, duration: Math.min(0.3, gap * 0.9 * BEAT), ease: "power3.out" }, at(hit));
          });
          window.__timelines["roll"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
