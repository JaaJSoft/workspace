<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - search</title>
</head>
<body>
  <template id="search">
    <div id="search-root" data-composition-id="search" data-width="1920" data-height="1080">
      <style>
        #search-root { position: absolute; inset: 0; }
        .search.scene { perspective: 2200px; }
        .search .copy { position: absolute; left: 120px; top: 300px; width: 700px; }
        .search .copy .slam { font-size: 124px; }
        .search .copy .label { margin-bottom: 28px; }
        .search .copy .sub { margin-top: 36px; }
        .search .win { left: 860px; top: 212px; width: 980px; height: 656px; }
        @media (orientation: portrait) {
          .search .copy { left: 80px; top: 220px; width: 920px; }
          .search .win { left: 40px; top: 820px; width: 1000px; height: 669px; }
        }
      </style>
      <div class="scene search">
        <div class="copy">
          <div class="label">01 &middot; Unified search</div>
          <div class="slam s1">Find</div>
          <div class="slam s2"><em>anything.</em></div>
          <div class="sub">Files, mail, tasks, people. One box.</div>
        </div>
        <div class="win">
          <div class="win-bar"><i></i><i></i><i></i><span>workspace.example.com/<b></b></span></div>
          <div class="win-screen">
            <video id="search-take" data-hf-media-start-basis="local" src="assets/clips/dashboard-0.mp4" muted playsinline data-start="0.3" data-duration="4.05" data-media-start="1.0" data-playback-rate="1.4" data-track-index="4"></video>
          </div>
        </div>
      </div>
      <script>
        (() => {
          // cursor-ui-demo: the filmed take is the demo; the line slams on the beat.
          const { $, at, end } = window.promo.scene("search");
          const { slam, windowIn, drift } = window.promo;
          const tl = gsap.timeline({ paused: true });
          slam(tl, $(".label"), at(0), "left");
          slam(tl, $(".s1"), at(0), "left");
          slam(tl, $(".s2"), at(1), "scale");
          slam(tl, $(".sub"), at(4), "rise");
          windowIn(tl, $(".win"), at(0) - 0.1, 1);
          drift(tl, $(".win"), at(1.5), end, { y: -10 }, 2.2);
          window.__timelines["search"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
