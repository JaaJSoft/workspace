<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - talk</title>
</head>
<body>
  <template id="talk">
    <div id="talk-root" data-composition-id="talk" data-width="1920" data-height="1080">
      <style>
        #talk-root { position: absolute; inset: 0; }
        .talk.scene { perspective: 2000px; }
        .talk .t1 { position: absolute; left: 100px; top: 70px; font-size: 104px; }
        .talk .t2 { position: absolute; right: 100px; top: 900px; font-size: 104px; text-align: right; }
        .talk .win { top: 250px; width: 820px; height: 556px; }
        .talk .left { left: 110px; }
        .talk .right { left: 990px; }
        .talk .chip { position: absolute; top: 230px; }
        .talk .c1 { left: 760px; }
        .talk .c2 { left: 1000px; }
        @media (orientation: portrait) {
          .talk .t1 { left: 60px; top: 110px; font-size: 92px; }
          .talk .t2 { right: 60px; top: 1740px; font-size: 92px; }
          .talk .win { left: 60px; width: 960px; height: 644px; }
          .talk .left { top: 300px; }
          .talk .right { top: 1020px; }
          .talk .c1 { left: 620px; top: 920px; }
          .talk .c2 { left: 80px; top: 1640px; }
        }
      </style>
      <div class="scene talk">
        <div class="slam t1">Talk to your team.</div>
        <div class="win left">
          <div class="win-bar"><i></i><i></i><i></i><span>workspace.example.com/<b>chat</b></span></div>
          <div class="win-screen">
            <video id="talk-chat" data-hf-media-start-basis="local" src="assets/clips/chat-0.mp4" muted playsinline data-start="0.3" data-duration="4.05" data-media-start="0.8" data-playback-rate="1.7" data-track-index="4"></video>
          </div>
        </div>
        <div class="win right">
          <div class="win-bar"><i></i><i></i><i></i><span>workspace.example.com/<b>chat/nova</b></span></div>
          <div class="win-screen">
            <video id="talk-ai" data-hf-media-start-basis="local" src="assets/clips/ai-0.mp4" muted playsinline data-start="0.3" data-duration="4.05" data-media-start="1.0" data-playback-rate="1.7" data-track-index="5"></video>
          </div>
        </div>
        <div class="chip c1"><i data-lucide="zap"></i>Real-time</div>
        <div class="chip c2"><i data-lucide="sparkles"></i>Any AI model</div>
        <div class="slam t2">And to your <em>AI.</em></div>
      </div>
      <script>
        (() => {
          // comparison-split: two surfaces of equal weight from opposite wings,
          // mirrored book-open tilts, a badge punctuating each.
          const { $, at, end, PORTRAIT } = window.promo.scene("talk");
          const { slam, pop, drift } = window.promo;
          const tl = gsap.timeline({ paused: true });
          slam(tl, $(".t1"), at(0), "drop");
          const tilt = PORTRAIT ? 0 : 10;
          tl.fromTo($(".left"), { x: -220, rotationY: tilt * 3, scale: 0.85, opacity: 0 }, { x: 0, rotationY: tilt, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, at(0));
          tl.fromTo($(".right"), { x: 220, rotationY: -tilt * 3, scale: 0.85, opacity: 0 }, { x: 0, rotationY: -tilt, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, at(0) + 0.2);
          drift(tl, $(".left"), at(2), end, { y: -8 }, 2.0);
          drift(tl, $(".right"), at(2), end, { y: 8 }, 2.0);
          pop(tl, $(".c1"), at(2));
          pop(tl, $(".c2"), at(5));
          slam(tl, $(".t2"), at(4), "right");
          window.__timelines["talk"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
