<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Promo - wall</title>
</head>
<body>
  <template id="wall">
    <div id="wall-root" data-composition-id="wall" data-width="1920" data-height="1080">
      <style>
        #wall-root { position: absolute; inset: 0; }
        .wall .field { background: #6d28d9; }
        .wall .grid-wall { position: absolute; left: 36px; top: 36px; right: 36px; bottom: 36px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 24px; }
        .wall .cell { position: relative; border-radius: 14px; overflow: hidden; background: #fff; border: 6px solid var(--mc); }
        .wall .cell video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .wall .portrait-only { display: none; }
        .wall .band { position: absolute; left: 0; right: 0; top: 50%; height: 360px; margin-top: -180px; background: #6d28d9; transform-origin: 50% 50%; }
        .wall .w1 { position: absolute; left: 0; right: 0; top: 50%; margin-top: -175px; text-align: center; font-size: 120px; }
        .wall .w2 { position: absolute; left: 0; right: 0; top: 50%; margin-top: -5px; text-align: center; font-size: 150px; }
        @media (orientation: portrait) {
          .wall .grid-wall { left: 24px; right: 24px; top: 300px; bottom: 300px; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(5, 1fr); gap: 18px; }
          .wall .portrait-only { display: block; }
          .wall .band { height: 420px; margin-top: -210px; }
          .wall .w1 { margin-top: -190px; font-size: 96px; }
          .wall .w2 { margin-top: -30px; font-size: 120px; }
        }
      </style>
      <div class="scene wall on-colour" style="--mc: #6d28d9">
        <div class="field layer"></div>
        <div class="grid-wall">
          <div class="cell" style="--mc: #b45309"><video id="wall-mail" data-hf-media-start-basis="local" src="assets/takes/mail.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="2.2" data-track-index="4"></video></div>
          <div class="cell" style="--mc: #4338ca"><video id="wall-files" data-hf-media-start-basis="local" src="assets/takes/files.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="3.4" data-track-index="5"></video></div>
          <div class="cell" style="--mc: #0f766e"><video id="wall-calendar" data-hf-media-start-basis="local" src="assets/takes/calendar.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="2.4" data-track-index="6"></video></div>
          <div class="cell" style="--mc: #0369a1"><video id="wall-chat" data-hf-media-start-basis="local" src="assets/takes/chat.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="1.6" data-track-index="7"></video></div>
          <div class="cell" style="--mc: #6d28d9"><video id="wall-dashboard" data-hf-media-start-basis="local" src="assets/takes/dashboard.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="1.8" data-track-index="8"></video></div>
          <div class="cell" style="--mc: #c2410c"><video id="wall-projects" data-hf-media-start-basis="local" src="assets/takes/projects.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="0.8" data-track-index="9"></video></div>
          <div class="cell" style="--mc: #047857"><video id="wall-notes" data-hf-media-start-basis="local" src="assets/takes/notes.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="2.2" data-track-index="11"></video></div>
          <div class="cell" style="--mc: #65a30d"><video id="wall-photos" data-hf-media-start-basis="local" src="assets/takes/photos.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="2.6" data-track-index="12"></video></div>
          <div class="cell" style="--mc: #7e22ce"><video id="wall-vault" data-hf-media-start-basis="local" src="assets/takes/vault.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="2.4" data-track-index="13"></video></div>
          <div class="cell portrait-only" style="--mc: #be185d"><video id="wall-ai" data-hf-media-start-basis="local" src="assets/takes/ai.mp4" muted playsinline data-start="0" data-duration="4.35" data-media-start="3.0" data-track-index="14"></video></div>
        </div>
        <div class="band"></div>
        <div class="slam w1">All in one</div>
        <div class="slam w2">place.</div>
      </div>
      <script>
        (() => {
          // grid-card-assemble, zoom-out variant, flat: the frame pulls back
          // from one take until every module plays at once, then a colour
          // band slams across and carries the line.
          const { $, at } = window.promo.scene("wall");
          const { slam } = window.promo;
          const tl = gsap.timeline({ paused: true });
          tl.fromTo($(".grid-wall"), { scale: 2.8 }, { scale: 1, duration: 1.4, ease: "expo.inOut" }, at(0) - 0.2);
          tl.fromTo($(".band"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power4.out" }, at(4));
          slam(tl, $(".w1"), at(4), "left");
          slam(tl, $(".w2"), at(5), "scale");
          window.__timelines["wall"] = tl;
        })();
      </script>
    </div>
  </template>
</body>
</html>
