{# Calendar Create/Edit modal and External Calendar (ICS) modal. #}
{# Included from index.html inside the main content block. #}
<!-- Calendar Create/Edit Modal -->
<dialog
  class="modal"
  :class="showCalendarModal && 'modal-open'"
  @click.self="showCalendarModal = false"
  @keydown.escape.window="showCalendarModal = false"
>
  <div class="modal-box w-11/12 max-w-sm">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg flex items-center gap-2">
        <span
          class="w-8 h-8 rounded-full flex items-center justify-center bg-module/15 text-module"
        >
          <i
            :data-lucide="calendarModalMode === 'create' ? 'calendar-plus' : 'pencil'"
            class="w-4 h-4"
          ></i>
        </span>
        <span
          x-text="calendarModalMode === 'create' ? 'New calendar' : 'Edit calendar'"
        ></span>
      </h3>
      <button
        type="button"
        class="btn btn-sm btn-square btn-ghost"
        @click="showCalendarModal = false"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <form @submit.prevent="saveCalendar()" class="space-y-4">
      <label class="form-control w-full">
        <div class="label"><span class="label-text">Name</span></div>
        <input
          id="calendar-form-name"
          type="text"
          class="input input-bordered input-sm w-full"
          x-model="calendarForm.name"
          placeholder="Calendar name"
          required
        />
      </label>

      <div>
        <div class="label"><span class="label-text">Color</span></div>
        <div class="flex flex-wrap gap-2">
          <template x-for="c in calendarColors" :key="c">
            <button
              type="button"
              class="w-8 h-8 rounded-full flex items-center justify-center transition-all border-2"
              :class="calendarForm.color === c
                      ? 'border-base-content scale-110 ring-2 ring-base-content/20'
                      : 'border-transparent hover:scale-105'"
              :style="'background-color: oklch(var(--' + ({primary:'p',secondary:'s',accent:'a',info:'in',success:'su',warning:'wa',error:'er'}[c]) + '))'"
              @click="calendarForm.color = c"
            >
              <i
                data-lucide="check"
                class="w-4 h-4"
                x-show="calendarForm.color === c"
                :style="'color: oklch(var(--' + ({primary:'pc',secondary:'sc',accent:'ac',info:'inc',success:'suc',warning:'wac',error:'erc'}[c]) + '))'"
              ></i>
            </button>
          </template>
        </div>
      </div>

      <div
        x-show="calendarModalMode === 'edit'"
        class="border-t border-base-300 pt-4"
      >
        <div class="flex items-center gap-2 text-sm font-medium">
          <i data-lucide="rss" class="w-4 h-4 text-module"></i>
          Subscription link
        </div>
        <p class="text-xs text-base-content/60 mt-1">
          Anyone with the link can see this calendar from another calendar app, read-only.
        </p>
        <div x-show="calendarFeed.loading" class="mt-3">
          <span class="loading loading-spinner loading-xs"></span>
        </div>
        <template x-if="!calendarFeed.loading && !calendarFeed.url">
          <button
            type="button"
            class="btn btn-sm btn-outline mt-3"
            :disabled="calendarFeed.busy"
            @click="enableCalendarFeed()"
          >
            <i data-lucide="link" class="w-4 h-4"></i>
            Create link
          </button>
        </template>
        <template x-if="!calendarFeed.loading && calendarFeed.url">
          <div class="mt-3 space-y-2">
            <div class="join w-full">
              <input
                type="text"
                class="input input-bordered input-sm join-item w-full font-mono text-xs"
                :value="calendarFeed.url"
                readonly
                @focus="$event.target.select()"
                aria-label="Subscription link"
              />
              <button
                type="button"
                class="btn btn-sm join-item"
                title="Copy link"
                @click="copyCalendarFeed()"
              >
                <i data-lucide="copy" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="flex gap-2">
              <button
                type="button"
                class="btn btn-xs btn-ghost"
                :disabled="calendarFeed.busy"
                @click="enableCalendarFeed()"
              >
                <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                New link
              </button>
              <button
                type="button"
                class="btn btn-xs btn-ghost text-error"
                :disabled="calendarFeed.busy"
                @click="disableCalendarFeed()"
              >
                <i data-lucide="link-2-off" class="w-3 h-3"></i>
                Turn off
              </button>
            </div>
          </div>
        </template>
      </div>

      <div class="modal-action">
        <button
          type="button"
          class="btn btn-sm btn-ghost"
          @click="showCalendarModal = false"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-sm btn-module"
          :disabled="savingCalendar || !calendarForm.name.trim()"
        >
          <span class="loading loading-spinner loading-xs" x-show="savingCalendar"></span>
          <span x-text="calendarModalMode === 'create' ? 'Create' : 'Save'"></span>
        </button>
      </div>
    </form>
  </div>
</dialog>

<!-- External Calendar Modal -->
<dialog
  class="modal"
  :class="showExternalModal && 'modal-open'"
  @click.self="showExternalModal = false"
  @keydown.escape.window="showExternalModal && (showExternalModal = false)"
>
  <div class="modal-box w-11/12 max-w-sm">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg flex items-center gap-2">
        <span
          class="w-8 h-8 rounded-full flex items-center justify-center bg-info/10 text-info"
        >
          <i data-lucide="globe" class="w-4 h-4"></i>
        </span>
        Add external calendar
      </h3>
      <button
        type="button"
        class="btn btn-sm btn-square btn-ghost"
        @click="showExternalModal = false"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <form @submit.prevent="saveExternalCalendar()" class="space-y-4">
      <label class="form-control w-full">
        <div class="label"><span class="label-text">ICS URL</span></div>
        <input
          id="external-form-url"
          type="url"
          class="input input-bordered input-sm w-full"
          x-model="externalForm.url"
          placeholder="https://calendar.google.com/...ical"
          required
        />
      </label>

      <label class="form-control w-full">
        <div class="label"><span class="label-text">Name</span></div>
        <input
          type="text"
          class="input input-bordered input-sm w-full"
          x-model="externalForm.name"
          placeholder="My external calendar"
        />
      </label>

      <div>
        <div class="label"><span class="label-text">Color</span></div>
        <div class="flex flex-wrap gap-2">
          <template x-for="c in calendarColors" :key="c">
            <button
              type="button"
              class="w-8 h-8 rounded-full flex items-center justify-center transition-all border-2"
              :class="externalForm.color === c
                      ? 'border-base-content scale-110 ring-2 ring-base-content/20'
                      : 'border-transparent hover:scale-105'"
              :style="'background-color: oklch(var(--' + ({primary:'p',secondary:'s',accent:'a',info:'in',success:'su',warning:'wa',error:'er'}[c]) + '))'"
              @click="externalForm.color = c"
            >
              <i
                data-lucide="check"
                class="w-4 h-4"
                x-show="externalForm.color === c"
                :style="'color: oklch(var(--' + ({primary:'pc',secondary:'sc',accent:'ac',info:'inc',success:'suc',warning:'wac',error:'erc'}[c]) + '))'"
              ></i>
            </button>
          </template>
        </div>
      </div>

      <div class="modal-action">
        <button
          type="button"
          class="btn btn-sm btn-ghost"
          @click="showExternalModal = false"
          :disabled="savingExternal"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="btn btn-sm btn-module"
          :disabled="!externalForm.url.trim() || savingExternal"
        >
          <span class="loading loading-spinner loading-xs" x-show="savingExternal"></span>
          <span x-text="savingExternal ? 'Adding...' : 'Add'"></span>
        </button>
      </div>
    </form>
  </div>
</dialog>
