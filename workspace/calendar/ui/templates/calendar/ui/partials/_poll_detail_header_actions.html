{# Header buttons of the poll detail modal, rendered by ui/partials/dialog_header.html. #}
{% load i18n %}
{% translate "open" context "poll status" as status_open %}
{% translate "closed" context "poll status" as status_closed %}
<span
  class="badge badge-sm mr-1"
  :class="currentPoll?.status === 'open' ? 'badge-success' : 'badge-ghost'"
  x-show="currentPoll"
  x-text="currentPoll?.status === 'open' ? '{{ status_open|escapejs }}' : currentPoll?.status === 'closed' ? '{{ status_closed|escapejs }}' : currentPoll?.status"
></span>
<button
  type="button"
  class="btn btn-sm btn-ghost btn-square"
  @click="closePollDetail(); openPollList()"
  title="{% translate 'Back to polls' %}"
>
  <i data-lucide="arrow-left" class="w-4 h-4"></i>
</button>
<button
  type="button"
  class="btn btn-sm btn-ghost"
  @click="copyPollShareLink()"
  title="{% translate 'Copy share link' %}"
  x-show="currentPoll"
>
  <i data-lucide="share-2" class="w-4 h-4"></i>
  <span class="hidden sm:inline">{% translate "Share" %}</span>
</button>
<template x-if="isPollCreator() && currentPoll?.status === 'open'">
  <button
    type="button"
    class="btn btn-sm btn-ghost"
    @click="openPollEdit()"
    title="{% translate 'Edit poll' %}"
  >
    <i data-lucide="pencil" class="w-4 h-4"></i>
  </button>
</template>
<template x-if="isPollCreator()">
  <button
    type="button"
    class="btn btn-sm btn-ghost text-error"
    @click="deletePoll(currentPoll.uuid)"
    title="{% translate 'Delete poll' %}"
  >
    <i data-lucide="trash-2" class="w-4 h-4"></i>
  </button>
</template>
