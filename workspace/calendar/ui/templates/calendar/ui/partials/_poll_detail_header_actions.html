{# Header buttons of the poll detail modal, rendered by ui/partials/dialog_header.html. #}
<span
  class="badge badge-sm mr-1"
  :class="currentPoll?.status === 'open' ? 'badge-success' : 'badge-ghost'"
  x-show="currentPoll"
  x-text="currentPoll?.status"
></span>
<button
  type="button"
  class="btn btn-sm btn-ghost btn-square"
  @click="closePollDetail(); openPollList()"
  title="Back to polls"
>
  <i data-lucide="arrow-left" class="w-4 h-4"></i>
</button>
<button
  type="button"
  class="btn btn-sm btn-ghost"
  @click="copyPollShareLink()"
  title="Copy share link"
  x-show="currentPoll"
>
  <i data-lucide="share-2" class="w-4 h-4"></i>
  <span class="hidden sm:inline">Share</span>
</button>
<template x-if="isPollCreator() && currentPoll?.status === 'open'">
  <button
    type="button"
    class="btn btn-sm btn-ghost"
    @click="openPollEdit()"
    title="Edit poll"
  >
    <i data-lucide="pencil" class="w-4 h-4"></i>
  </button>
</template>
<template x-if="isPollCreator()">
  <button
    type="button"
    class="btn btn-sm btn-ghost text-error"
    @click="deletePoll(currentPoll.uuid)"
    title="Delete poll"
  >
    <i data-lucide="trash-2" class="w-4 h-4"></i>
  </button>
</template>
