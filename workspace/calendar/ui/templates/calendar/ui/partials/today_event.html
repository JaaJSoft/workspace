{% load i18n ui_filters %}
<a
  href="/calendar?event={{ item.uuid }}"
  class="flex items-center gap-3 py-2 group"
  onmouseenter="window.matchMedia('(hover: hover)').matches&&window._eventCardShow(this,'{{ item.uuid|escapejs }}')"
  onmouseleave="window.matchMedia('(hover: hover)').matches&&window._cardPopoverScheduleHide(this)"
>
  <span class="w-4 flex justify-center shrink-0">
    <span class="w-2 h-2 rounded-full bg-{{ item.calendar.color }}"></span>
  </span>
  <span
    class="text-xs text-base-content/60 tabular-nums shrink-0 w-16 truncate"
  >
    {% if item.all_day %}
      {% translate "All day" context "short event time slot" %}
    {% else %}
      {{ item.start|localtime_tag:"time" }}
    {% endif %}
  </span>
  <span
    class="text-sm text-base-content truncate flex-1 min-w-0 group-hover:underline"
  >{{ item.title }}</span>
</a>
