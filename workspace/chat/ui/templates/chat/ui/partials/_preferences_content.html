<div class="space-y-3">
  <label class="flex items-center justify-between gap-2 cursor-pointer">
    <span class="text-sm">Compact conversation list</span>
    <input type="checkbox" class="toggle toggle-sm toggle-info"
      :checked="prefs.compactConversationList"
      @change="update('compactConversationList', $event.target.checked)">
  </label>
  <label class="flex items-center justify-between gap-2 cursor-pointer">
    <span class="text-sm">Compact message view</span>
    <input type="checkbox" class="toggle toggle-sm toggle-info"
      :checked="prefs.compactMessageView"
      @change="update('compactMessageView', $event.target.checked)">
  </label>
  {% comment %}
    updateAndSync, not update: thread replies are filtered out of the message
    list server-side, so the list on screen cannot honour the new value until
    it is refetched, and that refetch has to wait for the write to land.
  {% endcomment %}
  <label class="flex items-center justify-between gap-2 cursor-pointer">
    <span class="text-sm">Show thread replies in the conversation</span>
    <input type="checkbox" class="toggle toggle-sm toggle-info"
      :checked="prefs.showThreadRepliesInline"
      @change="updateAndSync('showThreadRepliesInline', $event.target.checked)">
  </label>
  <label class="flex items-center justify-between gap-2 cursor-pointer">
    <span class="text-sm">Call sounds</span>
    <input type="checkbox" class="toggle toggle-sm toggle-info"
      :checked="callSounds"
      @change="saveCallSounds($event.target.checked)">
  </label>
  <div class="pt-4 border-t border-base-300">
    <button type="button"
      class="btn btn-ghost btn-sm w-full justify-start gap-2 hover:text-info"
      @click="$dispatch('chat-run-diagnostic'); $el.closest('dialog')?.close()">
      <i data-lucide="activity" class="w-4 h-4 text-info"></i>
      <span class="text-sm">Test call connection</span>
    </button>
  </div>
</div>
