{% for r in quick_reactions %}
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square text-base leading-none{% if r.has_mine %} bg-module/20 text-module hover:bg-module/30{% endif %}"
    @click="toggleReaction('{{ message_uuid }}', '{{ r.emoji|escapejs }}')"
    {% if r.has_mine %}title="You reacted with {{ r.emoji }}"{% endif %}
  >{{ r.emoji }}</button>
{% endfor %}
