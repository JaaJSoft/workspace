{% load ui_filters %}
<div id="readers-popover-{{ message_uuid }}">
  <div class="text-xs font-semibold text-base-content/70 mb-1.5 px-1">Read by</div>
  {% for r in readers %}
    <div class="flex items-center py-1 px-1 rounded hover:bg-base-200">
      <user-avatar class="flex-1" user-id="{{ r.user.id }}" username="{{ r.user.username }}" size="2xs" name display-name="{{ r.user.get_full_name|default:r.user.username }}" name-class="text-xs font-medium"></user-avatar>
    </div>
  {% empty %}
    <div class="text-xs text-base-content/40 px-1 py-1">No one yet</div>
  {% endfor %}
  {% if not_read %}
    <div class="text-[0.6rem] text-base-content/30 mt-1.5 mb-0.5 px-1">Not yet</div>
    {% for nr in not_read %}
      <div class="flex items-center py-1 px-1 opacity-40">
        <user-avatar user-id="{{ nr.user.id }}" username="{{ nr.user.username }}" size="2xs" name display-name="{{ nr.user.get_full_name|default:nr.user.username }}" name-class="text-xs"></user-avatar>
      </div>
    {% endfor %}
  {% endif %}
</div>
