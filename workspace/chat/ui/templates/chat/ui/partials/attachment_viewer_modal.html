<!-- Chat Attachment Viewer Modal -->
<div x-data="chatAttachmentViewer()">
  <dialog x-ref="dialog" class="modal" @close="open = false">
    <div class="modal-box max-h-[90vh] w-full h-full p-0 flex flex-col max-w-5xl relative">
      <!-- Actions (Top Right) -->
      <div class="absolute top-4 right-4 z-10 flex items-center gap-1">
        <!-- Download -->
        <a :href="downloadUrl" download
           class="btn btn-ghost btn-sm btn-square" title="Download">
          <i data-lucide="download" class="w-4 h-4"></i>
        </a>
        <!-- Save to Files -->
        <button type="button" class="btn btn-ghost btn-sm btn-square"
                @click="saveToFiles()" title="Save to Files">
          <i data-lucide="folder-down" class="w-4 h-4"></i>
        </button>
        <!-- Close -->
        <button type="button" class="btn btn-ghost btn-sm btn-square"
                @click="close()" title="Close (ESC)">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Header -->
      <div class="flex items-center gap-2 p-4 pr-24 border-b border-base-300 bg-base-100">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg truncate" x-text="fileName"></h3>
          <div class="flex items-center gap-2">
            <p class="text-sm text-base-content/60" x-text="mimeType"></p>
            <span
              class="text-xs text-base-content/40"
              x-show="_totalViewable() > 1"
              x-text="(_currentIndex() + 1) + ' / ' + _totalViewable()"
            ></span>
          </div>
        </div>
      </div>

      <!-- Viewer Container -->
      <div x-ref="viewerContainer" class="flex-1 overflow-auto bg-base-200"
           x-show="!loading && !error"></div>

      <!-- Loading -->
      <div x-show="loading" class="flex-1 flex items-center justify-center" x-cloak>
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- Error -->
      <div x-show="error" class="flex-1 flex items-center justify-center p-8" x-cloak>
        <div class="text-center">
          <i data-lucide="alert-circle" class="w-12 h-12 text-error mx-auto mb-4"></i>
          <p class="text-lg font-medium mb-2">Failed to load file</p>
          <p class="text-sm text-base-content/60" x-text="error"></p>
        </div>
      </div>

      <!-- Prev / Next overlay arrows -->
      <button
        type="button"
        class="btn btn-circle absolute left-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Previous attachment"
        x-show="_totalViewable() > 1 && _currentIndex() > 0"
        x-cloak
        @click="navigatePrev()"
      >
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button
        type="button"
        class="btn btn-circle absolute right-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Next attachment"
        x-show="_totalViewable() > 1 && _currentIndex() >= 0 && _currentIndex() < _totalViewable() - 1"
        x-cloak
        @click="navigateNext()"
      >
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Backdrop -->
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <script>
    function chatAttachmentViewer() {
      return {
        open: false,
        loading: false,
        error: null,
        attachmentUuid: null,
        fileName: '',
        mimeType: '',
        downloadUrl: '',
        loadedScripts: [],

        async openAttachment(uuid, name, mimeType) {
          this.attachmentUuid = uuid;
          this.fileName = name || 'File';
          this.mimeType = mimeType || '';
          this.downloadUrl = '/api/v1/chat/attachments/' + uuid;
          this.error = null;

          const container = this.$refs.viewerContainer;

          // Dispatch cleanup event before removing DOM
          window.dispatchEvent(new CustomEvent('viewer-cleanup'));

          // Clear previous content and scripts
          container.replaceChildren();
          this.loadedScripts.forEach(function(s) { s.remove(); });
          this.loadedScripts = [];

          this.loading = true;
          this.open = true;
          this.$refs.dialog.showModal();

          try {
            const response = await fetch('/chat/view-attachment/' + uuid);
            if (!response.ok) {
              throw new Error('Failed to load viewer: ' + response.status);
            }

            const rawHtml = await response.text();

            // Parse HTML
            const temp = document.createElement('template');
            temp.innerHTML = rawHtml;

            // Extract and re-execute scripts
            const scriptEls = temp.content.querySelectorAll('script');
            const scripts = [];
            const self = this;
            scriptEls.forEach(function(el) {
              scripts.push(el.textContent);
              el.remove();
            });

            scripts.forEach(function(scriptContent) {
              const newScript = document.createElement('script');
              newScript.textContent = scriptContent;
              document.head.appendChild(newScript);
              self.loadedScripts.push(newScript);
            });

            // Move content to container
            while (temp.content.firstChild) {
              container.appendChild(temp.content.firstChild);
            }
          } catch (err) {
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        },

        _getViewableAttachments() {
          const els = document.querySelectorAll('#message-list [data-attachment-uuid]');
          return Array.from(els)
            .filter(function(el) { return el.offsetParent !== null; })
            .map(function(el) {
              return {
                uuid: el.dataset.attachmentUuid,
                name: el.dataset.attachmentName,
                type: el.dataset.attachmentType,
              };
            });
        },

        _currentIndex() {
          // Read the reactive uuid before querying the DOM: the message list
          // loads after Alpine init, so without a reactive dependency these
          // bindings would be evaluated once against an empty list and stick.
          const current = this.attachmentUuid;
          const atts = this._getViewableAttachments();
          return atts.findIndex(function(a) { return a.uuid === current; });
        },

        _totalViewable() {
          void this.attachmentUuid;
          return this._getViewableAttachments().length;
        },

        navigateNext() {
          const atts = this._getViewableAttachments();
          const idx = this._currentIndex();
          if (idx >= 0 && idx < atts.length - 1) {
            const next = atts[idx + 1];
            this.openAttachment(next.uuid, next.name, next.type);
          }
        },

        navigatePrev() {
          const atts = this._getViewableAttachments();
          const idx = this._currentIndex();
          if (idx > 0) {
            const prev = atts[idx - 1];
            this.openAttachment(prev.uuid, prev.name, prev.type);
          }
        },

        handleKeydown(event) {
          if (!this.open) return;
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

          const active = document.activeElement;
          const tag = active && active.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (active && active.isContentEditable) return;

          event.preventDefault();
          if (event.key === 'ArrowLeft') {
            this.navigatePrev();
          } else {
            this.navigateNext();
          }
        },

        saveToFiles() {
          const uuid = this.attachmentUuid;
          this.close();
          // Delegate to the chat component which already has the working flow
          window.dispatchEvent(new CustomEvent('chat-save-attachment-to-files', {
            detail: { uuid: uuid },
          }));
        },

        close() {
          window.dispatchEvent(new CustomEvent('viewer-cleanup'));
          this.$refs.dialog.close();
          this.open = false;
          this.attachmentUuid = null;
          this.fileName = '';
          this.mimeType = '';
          this.error = null;
          this.$refs.viewerContainer.replaceChildren();
          this.loadedScripts.forEach(function(s) { s.remove(); });
          this.loadedScripts = [];
        },

        init() {
          const self = this;
          this._openHandler = function(e) {
            const d = e.detail;
            self.openAttachment(d.uuid, d.name, d.type);
          };
          this._keydownHandler = function(e) { self.handleKeydown(e); };
          window.addEventListener('open-chat-attachment-viewer', this._openHandler);
          window.addEventListener('keydown', this._keydownHandler);
          this._detachSwipe = window.attachSwipeNavigation(this.$refs.dialog, {
            onPrev: function() { self.navigatePrev(); },
            onNext: function() { self.navigateNext(); },
          });
        },
      };
    }
  </script>
</div>
