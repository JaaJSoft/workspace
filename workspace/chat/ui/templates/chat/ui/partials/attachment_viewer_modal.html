<!-- Chat Attachment Viewer Modal -->
<div
  x-data="chatAttachmentViewer()"
  @ajax:missing="_viewerMissing($event)"
  @ajax:merge="_viewerMerge($event)"
>
  <dialog x-ref="dialog" class="modal" @close="_onDialogClose()">
    <div
      class="modal-box max-h-[90vh] w-full h-full p-0 flex flex-col max-w-5xl relative"
    >
      <!-- Actions (Top Right) -->
      <div class="absolute top-4 right-4 z-10 flex items-center gap-1">
        <!-- Download -->
        <a
          :href="downloadUrl"
          download
          class="btn btn-ghost btn-sm btn-square"
          title="Download"
        >
          <i data-lucide="download" class="w-4 h-4"></i>
        </a>
        <!-- Save to Files -->
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          @click="saveToFiles()"
          title="Save to Files"
        >
          <i data-lucide="folder-down" class="w-4 h-4"></i>
        </button>
        <!-- Close -->
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          @click="close()"
          title="Close (ESC)"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Header -->
      <div
        class="flex items-center gap-2 p-4 pr-24 border-b border-base-300 bg-base-100"
      >
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg truncate" x-text="fileName"></h3>
          <div class="flex items-center gap-2">
            <p class="text-sm text-base-content/60" x-text="mimeType"></p>
            <span
              class="text-xs text-base-content/40"
              x-show="_totalViewable() > 1"
              x-text="(_currentIndex() + 1) + ' / ' + _totalViewable()"
            ></span>
          </div>
        </div>
      </div>

      <!-- Viewer Container: #viewer-panel is the alpine-ajax merge anchor
           every /chat/view-attachment/ response replaces (see viewer_panel.js). -->
      <div
        class="flex-1 overflow-auto bg-base-200"
        x-show="!viewerLoading && !viewerError"
      >
        <div id="viewer-panel" style="display: contents"></div>
      </div>

      <!-- Loading -->
      <div
        x-show="viewerLoading"
        class="flex-1 flex items-center justify-center"
        x-cloak
      >
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- Error -->
      <div
        x-show="viewerError"
        class="flex-1 flex items-center justify-center p-8"
        x-cloak
      >
        <div class="text-center">
          <i data-lucide="alert-circle" class="w-12 h-12 text-error mx-auto mb-4"></i>
          <p class="text-lg font-medium mb-2">Failed to load file</p>
          <p class="text-sm text-base-content/60" x-text="viewerError"></p>
        </div>
      </div>

      <!-- Prev / Next overlay arrows -->
      <button
        type="button"
        class="btn btn-circle absolute left-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Previous attachment"
        x-show="_totalViewable() > 1 && _currentIndex() > 0"
        x-cloak
        @click="navigatePrev()"
      >
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button
        type="button"
        class="btn btn-circle absolute right-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Next attachment"
        x-show="_totalViewable() > 1 && _currentIndex() >= 0 && _currentIndex() < _totalViewable() - 1"
        x-cloak
        @click="navigateNext()"
      >
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Backdrop -->
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <script>
    function chatAttachmentViewer() {
      return {
        ...viewerPanelMixin(),
        open: false,
        attachmentUuid: null,
        fileName: '',
        mimeType: '',
        downloadUrl: '',

        async openAttachment(uuid, name, mimeType) {
          this.attachmentUuid = uuid;
          this.fileName = name || 'File';
          this.mimeType = mimeType || '';
          this.downloadUrl = '/api/v1/chat/attachments/' + uuid;
          this.open = true;
          // Gallery navigation re-opens over an already-open dialog: the
          // current spec makes that a no-op, but older engines throw.
          if (!this.$refs.dialog.open) {
            this.$refs.dialog.showModal();
          }

          await this.loadViewerPanel('/chat/view-attachment/' + uuid);
        },

        _getViewableAttachments() {
          const els = document.querySelectorAll('#message-list [data-attachment-uuid]');
          return Array.from(els)
            .filter(function(el) {
              return el.offsetParent !== null;
            })
            .map(function(el) {
              return {
                uuid: el.dataset.attachmentUuid,
                name: el.dataset.attachmentName,
                type: el.dataset.attachmentType,
              };
            });
        },

        _currentIndex() {
          // Read the reactive uuid before querying the DOM: the message list
          // loads after Alpine init, so without a reactive dependency these
          // bindings would be evaluated once against an empty list and stick.
          const current = this.attachmentUuid;
          const atts = this._getViewableAttachments();
          return atts.findIndex(function(a) {
            return a.uuid === current;
          });
        },

        _totalViewable() {
          void this.attachmentUuid;
          return this._getViewableAttachments().length;
        },

        navigateNext() {
          const atts = this._getViewableAttachments();
          const idx = this._currentIndex();
          if (idx >= 0 && idx < atts.length - 1) {
            const next = atts[idx + 1];
            this.openAttachment(next.uuid, next.name, next.type);
          }
        },

        navigatePrev() {
          const atts = this._getViewableAttachments();
          const idx = this._currentIndex();
          if (idx > 0) {
            const prev = atts[idx - 1];
            this.openAttachment(prev.uuid, prev.name, prev.type);
          }
        },

        handleKeydown(event) {
          if (!this.open) return;
          if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

          const active = document.activeElement;
          const tag = active && active.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (active && active.isContentEditable) return;

          event.preventDefault();
          if (event.key === 'ArrowLeft') {
            this.navigatePrev();
          } else {
            this.navigateNext();
          }
        },

        saveToFiles() {
          const uuid = this.attachmentUuid;
          this.close();
          // Delegate to the chat component which already has the working flow
          window.dispatchEvent(new CustomEvent('chat-save-attachment-to-files', {
            detail: {
              uuid: uuid
            },
          }));
        },

        // Every close path funnels here through the dialog's close event -
        // the explicit button, Escape, and the backdrop form. Cancels any
        // in-flight load so a late response cannot mount into the closed
        // modal, then disposes and empties the panel.
        _onDialogClose() {
          this.open = false;
          this.teardownViewerPanel();
          this.attachmentUuid = null;
          this.fileName = '';
          this.mimeType = '';
          this.viewerError = null;
        },

        close() {
          this.$refs.dialog.close();
        },

        init() {
          const self = this;
          this._openHandler = function(e) {
            const d = e.detail;
            self.openAttachment(d.uuid, d.name, d.type);
          };
          this._keydownHandler = function(e) {
            self.handleKeydown(e);
          };
          window.addEventListener('open-chat-attachment-viewer', this._openHandler);
          window.addEventListener('keydown', this._keydownHandler);
          this._detachSwipe = window.attachSwipeNavigation(this.$refs.dialog, {
            onPrev: function() {
              self.navigatePrev();
            },
            onNext: function() {
              self.navigateNext();
            },
          });
        },
      };
    }
  </script>
</div>
