{# Shared call stage: the member room and the guest page include this with host_controls=True/False. #}
<!-- Participants grid -->
<section
  data-testid="participants-grid"
  class="flex-1 flex flex-col gap-4 bg-base-200 p-4 min-w-0 relative"
>
  <!-- Call status bar -->
  <div class="flex items-center gap-2 text-sm shrink-0 pl-2">
    <span class="inline-block w-2 h-2 rounded-full bg-success shrink-0"></span>
    <span class="font-medium">In call</span>
    <span class="text-base-content/40">&middot;</span>
    <span class="text-base-content/70 tabular-nums" x-text="capacityLabel()"></span>
    <span class="text-base-content/40">&middot;</span>
    <span class="text-base-content/70 tabular-nums" x-text="callElapsed"></span>
  </div>

  <!-- Main area: remote participants or placeholder -->
  <div class="flex-1 min-h-0 relative">

    <!-- Placeholder: shown when no remote participants -->
    <template x-if="remoteParticipants().length === 0">
      <div
        class="absolute inset-0 flex flex-col items-center justify-center gap-3"
      >
        <i data-lucide="users" class="w-12 h-12 text-base-content/50"></i>
        <span class="text-sm text-base-content/50">Waiting for others to join...</span>
      </div>
    </template>

    <!-- Equal grid: no spotlight active -->
    <template x-if="remoteParticipants().length > 0 && !isSpotlight()">
      <div
        class="absolute inset-0 grid gap-4"
        :style="`grid-template-columns: repeat(${gridColumns()}, minmax(0, 1fr)); grid-auto-rows: 1fr;`"
      >
        <template x-for="p in remoteParticipants()" :key="p.participant_key">
          <div
            class="relative rounded-xl bg-base-100 border-2 flex flex-col items-center justify-center gap-2 transition-colors overflow-hidden cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
            :class="isSpeaking(p.participant_key) ? 'border-success' : 'border-base-300'"
            role="button"
            tabindex="0"
            :aria-label="'Spotlight ' + p.display_name"
            @click="pinTile(p.participant_key)"
            @keydown.enter.prevent="pinTile(p.participant_key)"
            @keydown.space.prevent="pinTile(p.participant_key)"
          >
            <video
              x-show="hasVideo(p)"
              autoplay
              playsinline
              muted
              class="absolute inset-0 w-full h-full object-cover bg-black"
              x-effect="$el.srcObject = streamFor(p.participant_key)"
            >
            </video>
            <template x-if="!hasVideo(p)">
              <div class="flex flex-col items-center gap-2">
                <user-avatar :user-id="p.user_id" :username="p.display_name" size="lg"></user-avatar>
                <span class="text-sm truncate max-w-full px-2" x-text="p.display_name"></span>
              </div>
            </template>
            <span
              x-show="hasVideo(p)"
              class="absolute bottom-1 left-2 text-xs bg-black/50 text-white rounded px-1"
              x-text="p.display_name"
            ></span>
            <i
              x-show="p.media_state && p.media_state.audio === false"
              data-lucide="mic-off"
              class="absolute top-1 right-1 w-4 h-4 text-error"
            ></i>
            {% if host_controls %}
              <button
                type="button"
                class="btn btn-xs btn-circle btn-error absolute top-1 left-1"
                x-show="isGuestTile(p)"
                @click.stop="removeGuest(p.participant_key)"
                title="Remove guest"
              >
                <i data-lucide="user-x" class="w-3 h-3"></i>
              </button>
            {% endif %}
          </div>
        </template>
      </div>
    </template>

    <!-- Spotlight: one large tile + thumbnail strip -->
    <template x-if="isSpotlight()">
      <div class="absolute inset-0 flex flex-col gap-3">
        <div
          class="relative flex-1 min-h-0 rounded-xl bg-base-100 border-2 border-base-300 overflow-hidden flex items-center justify-center cursor-pointer"
          @click="backToGrid()"
        >
          <template x-if="spotlightParticipant() && hasVideo(spotlightParticipant())">
            <video
              autoplay
              playsinline
              muted
              class="absolute inset-0 w-full h-full object-contain bg-black"
              x-effect="$el.srcObject = streamFor(spotlightKey())"
            >
            </video>
          </template>
          <template x-if="spotlightParticipant() && !hasVideo(spotlightParticipant())">
            <user-avatar :user-id="spotlightParticipant().user_id" :username="spotlightParticipant().display_name" size="xl"></user-avatar>
          </template>
          <span
            class="absolute bottom-2 left-3 text-sm bg-black/50 text-white rounded px-2 py-0.5"
            x-text="spotlightParticipant() ? spotlightParticipant().display_name : ''"
          ></span>
          <button
            class="btn btn-xs absolute top-2 right-2"
            @click.stop="backToGrid()"
            title="Back to grid"
          >
            <i data-lucide="grid-2x2" class="w-4 h-4"></i>
          </button>
        </div>
        <div
          class="flex gap-2 shrink-0 overflow-x-auto"
          x-show="stripParticipants().length > 0"
        >
          <template x-for="p in stripParticipants()" :key="p.participant_key">
            <div
              class="relative w-28 h-20 shrink-0 rounded-lg bg-base-100 border-2 overflow-hidden flex items-center justify-center cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
              :class="isSpeaking(p.participant_key) ? 'border-success' : 'border-base-300'"
              role="button"
              tabindex="0"
              :aria-label="'Spotlight ' + p.display_name"
              @click="pinTile(p.participant_key)"
              @keydown.enter.prevent="pinTile(p.participant_key)"
              @keydown.space.prevent="pinTile(p.participant_key)"
            >
              <video
                x-show="hasVideo(p)"
                autoplay
                playsinline
                muted
                class="absolute inset-0 w-full h-full object-cover bg-black"
                x-effect="$el.srcObject = streamFor(p.participant_key)"
              >
              </video>
              <template x-if="!hasVideo(p)">
                <user-avatar :user-id="p.user_id" :username="p.display_name" size="sm"></user-avatar>
              </template>
              <span
                class="absolute bottom-0.5 left-1 text-[10px] bg-black/50 text-white rounded px-1 truncate max-w-[6rem]"
                x-text="p.display_name"
              ></span>
              {% if host_controls %}
                <button
                  type="button"
                  class="btn btn-xs btn-circle btn-error absolute top-1 left-1"
                  x-show="isGuestTile(p)"
                  @click.stop="removeGuest(p.participant_key)"
                  title="Remove guest"
                >
                  <i data-lucide="user-x" class="w-3 h-3"></i>
                </button>
              {% endif %}
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Self-view tile: hidden while spotlighting (self appears in the strip) -->
    <template x-if="selfParticipant() && !isSpotlight()">
      <div
        data-testid="self-tile"
        class="absolute bottom-3 right-3 w-40 aspect-video rounded-lg bg-base-100 border-2 flex flex-col items-center justify-center gap-1 px-2 transition-colors overflow-hidden z-10"
        :class="isSpeaking(currentParticipantKey) ? 'border-success' : 'border-base-300'"
      >
        <video
          x-show="hasVideo(selfParticipant())"
          autoplay
          playsinline
          muted
          class="absolute inset-0 w-full h-full object-cover bg-black"
          x-effect="$el.srcObject = streamFor(currentParticipantKey)"
        >
        </video>
        <template x-if="!hasVideo(selfParticipant())">
          <div class="flex flex-col items-center gap-1">
            <user-avatar :user-id="selfParticipant().user_id" :username="selfParticipant().display_name" size="md"></user-avatar>
            <span
              class="text-xs truncate max-w-full text-center px-1"
              x-text="selfParticipant().display_name"
            ></span>
          </div>
        </template>
        <i
          x-show="isMuted"
          data-lucide="mic-off"
          class="absolute top-1 right-1 w-3 h-3 text-error"
        ></i>
      </div>
    </template>

  </div>

  <!-- Controls bar: centered dock at bottom -->
  <div class="flex justify-center shrink-0">
    <div
      class="inline-flex items-center gap-3 p-3 rounded-full bg-base-100/90 backdrop-blur border border-base-300 shadow-lg"
    >
      <button
        class="btn btn-circle border-0"
        :class="isMuted ? 'btn-error' : 'btn-neutral'"
        @click="toggleMute()"
        :title="isMuted ? 'Unmute' : 'Mute'"
      >
        <i :data-lucide="isMuted ? 'mic-off' : 'mic'" class="w-5 h-5"></i>
      </button>
      <button
        class="btn btn-circle border-0"
        :class="cameraOn ? 'btn-primary' : 'btn-neutral'"
        @click="toggleCamera()"
        :title="cameraOn ? 'Turn camera off' : 'Turn camera on'"
      >
        <i :data-lucide="cameraOn ? 'video' : 'video-off'" class="w-5 h-5"></i>
      </button>
      <button
        class="btn btn-circle border-0"
        :class="sharing ? 'btn-primary' : 'btn-neutral'"
        @click="toggleScreenShare()"
        :title="sharing ? 'Stop sharing' : 'Share screen'"
      >
        <i data-lucide="screen-share" class="w-5 h-5"></i>
      </button>
      {% if host_controls %}
        {# The diagnostic panel is a member-room feature: it names the conversation and its members. #}
        <button
          class="btn btn-neutral btn-circle border-0"
          @click="openDiagnostic()"
          :disabled="diagRunning"
          title="Connection diagnostic"
        >
          <i data-lucide="activity" class="w-5 h-5"></i>
        </button>
        <template x-if="meeting">
          <div class="contents">
            <button
              class="btn btn-circle border-0"
              :class="lobbyOpen ? 'btn-primary' : 'btn-neutral'"
              @click="lobbyOpen = !lobbyOpen; if (lobbyOpen) loadLobby()"
              title="Lobby"
            >
              <i data-lucide="door-open" class="w-5 h-5"></i>
              <span
                class="badge badge-xs badge-warning absolute -top-1 -right-1"
                x-show="lobby.length"
                x-text="lobby.length"
              ></span>
            </button>
            <button
              class="btn btn-circle border-0"
              :class="meeting && meeting.locked ? 'btn-warning' : 'btn-neutral'"
              @click="toggleLock()"
              :title="meeting && meeting.locked ? 'Unlock meeting' : 'Lock meeting'"
            >
              <i
                :data-lucide="meeting && meeting.locked ? 'lock' : 'lock-open'"
                class="w-5 h-5"
              ></i>
            </button>
            <button
              class="btn btn-neutral btn-circle border-0"
              @click="endMeeting()"
              title="End meeting for everyone"
            >
              <i data-lucide="square" class="w-5 h-5"></i>
            </button>
          </div>
        </template>
      {% endif %}
      <button
        class="btn btn-error btn-circle border-0"
        @click="leaveRoom()"
        title="Leave call"
      >
        <i data-lucide="phone-off" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  {% if host_controls %}
    <template x-if="meeting">
      <div
        class="absolute bottom-24 right-4 w-72 z-20 card bg-base-100 shadow-xl border border-base-300"
        x-show="lobbyOpen"
        x-transition
        x-cloak
      >
        <div class="card-body p-3 gap-2">
          <div class="flex items-center justify-between">
            <span class="font-medium text-sm">Lobby</span>
            <span
              class="text-xs text-base-content/60"
              x-text="meeting && meeting.locked ? 'Locked' : 'Open'"
            ></span>
          </div>
          <p class="text-xs text-base-content/60" x-show="!lobby.length">Nobody is waiting.</p>
          <template x-for="g in lobby" :key="g.uuid">
            <div class="flex items-center gap-2">
              <user-avatar :username="g.display_name" size="xs"></user-avatar>
              <span class="text-sm truncate flex-1" x-text="g.display_name"></span>
              <button class="btn btn-xs btn-success" @click="admitGuest(g.uuid)">Admit</button>
              <button class="btn btn-xs btn-ghost" @click="refuseGuest(g.uuid)">Refuse</button>
            </div>
          </template>
          <div class="flex items-center gap-1 pt-1 border-t border-base-200">
            <input
              class="input input-xs input-bordered flex-1 font-mono"
              readonly
              :value="meeting ? meeting.join_url : ''"
            />
            <button
              class="btn btn-xs"
              @click="navigator.clipboard.writeText(meeting.join_url).then(() => AppAlert.success('Join link copied', { duration: 2000 }))"
            >
              Copy
            </button>
          </div>
        </div>
      </div>
    </template>
  {% endif %}

</section>
