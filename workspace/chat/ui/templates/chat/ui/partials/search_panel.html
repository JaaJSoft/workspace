{% load i18n %}
{% translate "%(count)s result" as result_count_one %}
{% translate "%(count)s results" as result_count_other %}
<!-- Search panel header -->
<div
  class="px-4 py-3 border-b border-base-300 flex items-center justify-between"
>
  <h4 class="font-semibold text-sm">{% translate "Search messages" %}</h4>
  <button
    type="button"
    class="btn btn-ghost btn-xs btn-square"
    @click="closeSearchPanel()"
    title="{% translate 'Close' %}"
  >
    <i data-lucide="x" class="w-3.5 h-3.5"></i>
  </button>
</div>

<div class="p-4 space-y-3">
  <!-- Search input -->
  <label class="input input-sm flex items-center gap-2 w-full">
    <i data-lucide="search" class="w-3.5 h-3.5 opacity-50"></i>
    <input
      type="text"
      data-search-input
      x-model="searchQuery"
      @input.debounce.300ms="searchMessages()"
      @keydown="handleSearchKeydown($event)"
      @keydown.escape="closeSearchPanel()"
      class="grow"
      placeholder="{% translate 'Search...' %}"
    />
    <span
      x-show="searchQuery"
      class="btn btn-ghost btn-xs btn-square"
      @click="searchQuery = ''; searchMessages()"
      title="{% translate 'Clear search' %}"
    >
      <i data-lucide="x" class="w-3 h-3"></i>
    </span>
  </label>

  <!-- Filter toggle -->
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="btn btn-xs btn-ghost gap-1"
      :class="searchFiltersExpanded ? 'btn-active' : ''"
      @click="searchFiltersExpanded = !searchFiltersExpanded"
    >
      <i data-lucide="sliders-horizontal" class="w-3 h-3"></i>
      {% translate "Filters" %}
      <span x-show="hasActiveSearchFilters()" class="badge badge-xs badge-module"></span>
    </button>
    <button
      type="button"
      x-show="hasActiveSearchFilters()"
      class="btn btn-xs btn-ghost text-error gap-1"
      @click="clearSearchFilters()"
    >
      <i data-lucide="x" class="w-3 h-3"></i>
      {% translate "Clear" %}
    </button>
  </div>

  <!-- Collapsible filter section -->
  <div
    x-show="searchFiltersExpanded"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 -translate-y-1"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 -translate-y-1"
    class="space-y-2 p-3 bg-base-200/50 rounded-lg"
  >
    <!-- Sender filter -->
    <div>
      <label class="text-xs font-medium text-base-content/60 mb-1 block">{% translate "Sender" %}</label>
      <select
        class="select select-xs w-full"
        x-model="searchFilterAuthor"
        @change="searchMessages()"
      >
        <option value="">{% translate "Anyone" %}</option>
        <template x-for="m in (activeConversation?.members || [])" :key="m.user.id">
          <option :value="m.user.id" x-text="memberDisplayName(m)"></option>
        </template>
      </select>
    </div>

    <!-- Date filter -->
    <div>
      <label class="text-xs font-medium text-base-content/60 mb-1 block">{% translate "Date" %}</label>
      <select
        class="select select-xs w-full"
        x-model="searchFilterDateRange"
        @change="searchMessages()"
      >
        <option value="">{% translate "Any time" %}</option>
        <option value="today">{% translate "Today" %}</option>
        <option value="7d">{% translate "Last 7 days" %}</option>
        <option value="30d">{% translate "Last 30 days" %}</option>
        <option value="custom">{% translate "Custom range" %}</option>
      </select>
      <!-- Custom date inputs -->
      <div x-show="searchFilterDateRange === 'custom'" class="flex gap-2 mt-1">
        <input
          type="date"
          class="input input-xs flex-1"
          x-model="searchFilterDateFrom"
          @change="searchMessages()"
          placeholder="{% translate 'From' %}"
        />
        <input
          type="date"
          class="input input-xs flex-1"
          x-model="searchFilterDateTo"
          @change="searchMessages()"
          placeholder="{% translate 'To' context 'date range end' %}"
        />
      </div>
    </div>

    <!-- Attachment filters -->
    <div>
      <label class="text-xs font-medium text-base-content/60 mb-1 block">{% translate "Attachments" %}</label>
      <div class="flex gap-1">
        <button
          type="button"
          class="btn btn-xs gap-1"
          :class="searchFilterHasFiles ? 'btn-module' : 'btn-ghost'"
          @click="searchFilterHasFiles = !searchFilterHasFiles; if (searchFilterHasFiles) searchFilterHasImages = false; searchMessages()"
        >
          <i data-lucide="paperclip" class="w-3 h-3"></i>
          {% translate "Has files" %}
        </button>
        <button
          type="button"
          class="btn btn-xs gap-1"
          :class="searchFilterHasImages ? 'btn-module' : 'btn-ghost'"
          @click="searchFilterHasImages = !searchFilterHasImages; if (searchFilterHasImages) searchFilterHasFiles = false; searchMessages()"
        >
          <i data-lucide="image" class="w-3 h-3"></i>
          {% translate "Has images" %}
        </button>
      </div>
    </div>
  </div>

  <!-- Loading -->
  <div x-show="searchLoading" class="flex justify-center py-4">
    <span class="loading loading-spinner loading-sm text-module"></span>
  </div>

  <!-- Result count -->
  <div
    x-show="!searchLoading && (searchQuery.trim().length >= 2 || hasActiveSearchFilters()) && searchResults.length > 0"
    class="text-xs text-base-content/50"
  >
    <span
      x-text="interpolate(searchResults.length === 1 ? '{{ result_count_one|escapejs }}' : '{{ result_count_other|escapejs }}', { count: searchResults.length }, true)"
    ></span>
  </div>

  <!-- Results list -->
  <div
    x-show="!searchLoading && searchResults.length > 0"
    class="space-y-1 max-h-[calc(100vh-16rem)] overflow-y-auto"
  >
    <template x-for="(result, idx) in searchResults" :key="result.uuid">
      <div
        class="rounded-lg px-3 py-2 hover:bg-base-200 transition-colors cursor-pointer text-sm"
        :class="searchHighlight === idx ? 'bg-base-200' : ''"
        :data-search-result-active="searchHighlight === idx"
        @click="scrollToMessage(result.uuid, result.thread_root)"
        @mouseenter="searchHighlight = idx"
      >
        <div class="flex items-center gap-2 mb-0.5">
          <span
            class="font-medium text-xs"
            x-text="((result.author.first_name || '') + ' ' + (result.author.last_name || '')).trim() || result.author.username"
          ></span>
          <span
            class="text-[0.65rem] text-base-content/40"
            x-text="formatDateTime(result.created_at)"
          ></span>
        </div>
        {% comment %}body_html is server-rendered and sanitized, so it is
        highlighted unescaped - escaping it here would print the markup
        instead of rendering it.{% endcomment %}
        <div
          class="text-xs text-base-content/70 line-clamp-3 wrap-break-word msg-body"
          x-html="highlightMatch(result.body_html, searchQuery, { escape: false })"
        ></div>
      </div>
    </template>
  </div>

  <!-- Empty state: no results -->
  <div
    x-show="!searchLoading && (searchQuery.trim().length >= 2 || hasActiveSearchFilters()) && searchResults.length === 0"
    class="text-center py-6"
  >
    <i
      data-lucide="search-x"
      class="w-8 h-8 mx-auto text-base-content/20 mb-2"
    ></i>
    <p class="text-sm text-base-content/40">{% translate "No messages found" %}</p>
  </div>

  <!-- Empty state: prompt -->
  <div
    x-show="!searchLoading && searchQuery.trim().length < 2 && !hasActiveSearchFilters()"
    class="text-center py-6"
  >
    <i
      data-lucide="search"
      class="w-8 h-8 mx-auto text-base-content/20 mb-2"
    ></i>
    <p class="text-sm text-base-content/40">{% translate "Type at least 2 characters or use filters" %}</p>
  </div>
</div>
