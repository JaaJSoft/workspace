<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workspace — Offline</title>
    <script>
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
    </script>
    <!-- Literal paths, not {% static %}: the service worker serves this file
       as it is, so a template tag would ship as text. collectstatic keeps the
       unhashed names beside the hashed ones, so they resolve in production. -->
    <!-- djlint:off D004 -->
    <link href="/static/css/app.css" rel="stylesheet" type="text/css" />
    <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml" />
    <!-- djlint:on -->
    <script src="/static/ui/js/vendor/lucide/lucide.js"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-base-200">
    <div class="text-center p-8">
      <div class="flex items-center justify-center gap-4 mb-6">
        <div
          class="w-16 h-16 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center shadow-xl"
        >
          <i data-lucide="users" class="w-8 h-8 text-base-100"></i>
        </div>
        <span
          class="text-5xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent"
        >Workspace</span>
      </div>
      <h1 class="text-xl font-semibold mb-2">You're offline</h1>
      <p class="text-base-content/60 mb-6">Check your internet connection and try again.</p>
      <button class="btn btn-primary" onclick="location.reload()">Retry</button>
    </div>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
