{% load i18n %}
<div class="space-y-3">
  <template x-if="todaySources.length">
    <div>
      <div class="font-medium text-sm">{% translate "Today" %}</div>
      <div class="text-xs text-base-content/60 mb-3">{% translate "Choose what the Today card lists." %}</div>
      <div class="space-y-2">
        <template x-for="source in todaySources" :key="source.slug">
          <label class="flex items-center justify-between gap-4">
            <div class="min-w-0">
              <div class="font-medium text-sm" x-text="source.label"></div>
              <div class="text-xs text-base-content/60" x-text="source.description"></div>
            </div>
            <input
              type="checkbox"
              class="toggle toggle-sm toggle-primary shrink-0"
              :checked="isTodayShown(source.slug)"
              @change="toggleToday(source.slug, $event.target.checked)"
            />
          </label>
        </template>
      </div>
    </div>
  </template>

  <div
    class="pt-3 border-t border-base-300"
    :class="{ 'pt-0 border-t-0': !todaySources.length }"
  >
    <div class="font-medium text-sm">{% translate "Apps" %}</div>
    <div class="text-xs text-base-content/60 mb-3">{% translate "Choose which apps appear on your dashboard." %}</div>
    <div class="space-y-2 max-h-72 overflow-y-auto">
      <template x-for="app in apps" :key="app.slug">
        <label class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-2">
            <span
              class="w-7 h-7 rounded-lg flex items-center justify-center bg-module/15 text-module"
              :class="`module-${app.color}`"
            >
              <i :data-lucide="app.icon" class="w-4 h-4"></i>
            </span>
            <span class="font-medium text-sm" x-text="app.name"></span>
          </div>
          <input
            type="checkbox"
            class="toggle toggle-sm toggle-primary"
            :checked="isVisible(app.slug)"
            @change="toggleApp(app.slug, $event.target.checked)"
          />
        </label>
      </template>
    </div>
  </div>
</div>
