<div
  id="dashboard-tasks"
  class="card bg-base-100 shadow border border-base-300"
  x-data="{}"
  x-init="$ajax('{% url 'dashboard:tasks_fragment' %}')"
  @ajax:error="$el.replaceChildren()"
>
  <div class="card-body gap-3 p-4 sm:p-6 animate-pulse">
    <div class="h-7 bg-base-300 rounded w-40"></div>
    <ul class="divide-y divide-base-200">
      {% for _ in "123" %}
        <li class="py-2.5 flex items-center gap-3">
          <div class="h-3 w-16 bg-base-300 rounded flex-shrink-0"></div>
          <div class="h-4 bg-base-300 rounded flex-1"></div>
          <div class="h-4 w-14 bg-base-300 rounded flex-shrink-0"></div>
        </li>
      {% endfor %}
    </ul>
  </div>
</div>
