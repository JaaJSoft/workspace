<div class="card bg-base-100 shadow-sm border border-base-300">
  <div class="card-body gap-4 p-4 sm:p-6 animate-pulse">
    <div class="space-y-2">
      <div class="h-7 bg-base-300 rounded-sm w-40"></div>
      <div class="h-4 bg-base-300 rounded-sm w-64"></div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-5">
      {% for _ in "12" %}
        <div class="space-y-2">
          <div class="h-3 bg-base-300 rounded-sm w-24"></div>
          <ul class="divide-y divide-base-200">
            {% for _ in "123" %}
              <li class="py-1.5 flex items-center gap-3">
                <div class="h-3 w-14 bg-base-300 rounded-sm shrink-0"></div>
                <div class="h-3.5 bg-base-300 rounded-sm flex-1"></div>
              </li>
            {% endfor %}
          </ul>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
