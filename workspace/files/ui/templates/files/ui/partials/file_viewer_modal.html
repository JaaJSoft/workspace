<!-- File Viewer Modal -->
<div x-data="fileViewerModal()" @ajax:missing="_viewerMissing($event)">
  <dialog
    x-ref="dialog"
    class="modal"
    @close="open = false"
  >
    <div
      class="modal-box max-h-[90vh] w-full h-full p-0 flex flex-col relative transition-[max-width] duration-200"
      :class="expanded ? 'max-w-[90vw]' : 'max-w-5xl'"
    >
      <!-- Actions (Top Right) -->
      <div class="absolute top-4 right-4 z-10 flex items-center gap-1">
        <!-- Expand / Collapse -->
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          @click="toggleExpanded()"
          :title="expanded ? 'Compact view' : 'Expand view'"
          x-show="fileUuid"
        >
          <i x-show="!expanded" data-lucide="maximize-2" class="w-4 h-4"></i>
          <i x-show="expanded" data-lucide="minimize-2" class="w-4 h-4" x-cloak></i>
        </button>

        <!-- Download -->
        <a
          :href="`/api/v1/files/${fileUuid}/content`"
          download
          class="btn btn-ghost btn-sm btn-square"
          title="Download file"
          x-show="fileUuid"
        >
          <i data-lucide="download" class="w-4 h-4"></i>
        </a>

        <!-- Close -->
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square"
          @click="close()"
          title="Close (ESC)"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Header -->
      <div class="flex items-center gap-2 p-4 pr-24 border-b border-base-300 bg-base-100">
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-lg truncate" x-text="fileName"></h3>
          <div class="flex items-center gap-2">
            <p class="text-sm text-base-content/60" x-text="fileType"></p>
            <span
              class="text-xs text-base-content/40"
              x-show="_totalViewable() > 1"
              x-text="(_currentIndex() + 1) + ' / ' + _totalViewable()"
            ></span>
          </div>
        </div>
      </div>

      <!-- Viewer Container: #viewer-panel is the alpine-ajax merge anchor
           every /files/view/ response replaces (see viewer_panel.js). -->
      <div
        class="flex-1 overflow-auto bg-base-200"
        x-show="!viewerLoading && !viewerError"
      >
        <div id="viewer-panel" style="display: contents"></div>
      </div>

      <!-- Loading State -->
      <div
        x-show="viewerLoading"
        class="flex-1 flex items-center justify-center"
        x-cloak
      >
        <span class="loading loading-spinner loading-lg"></span>
      </div>

      <!-- Error State -->
      <div
        x-show="viewerError"
        class="flex-1 flex items-center justify-center p-8"
        x-cloak
      >
        <div class="text-center">
          <i data-lucide="alert-circle" class="w-12 h-12 text-error mx-auto mb-4"></i>
          <p class="text-lg font-medium mb-2">Failed to load file</p>
          <p class="text-sm text-base-content/60" x-text="viewerError"></p>
        </div>
      </div>

      <!-- Prev / Next overlay arrows -->
      <button
        type="button"
        class="btn btn-circle absolute left-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Previous file"
        x-show="_totalViewable() > 1 && _currentIndex() > 0"
        x-cloak
        @click="navigatePrev()"
      >
        <i data-lucide="chevron-left" class="w-5 h-5"></i>
      </button>
      <button
        type="button"
        class="btn btn-circle absolute right-3 top-1/2 -translate-y-1/2 z-10 bg-base-100/80 hover:bg-base-100 border-base-300 shadow"
        title="Next file"
        x-show="_totalViewable() > 1 && _currentIndex() >= 0 && _currentIndex() < _totalViewable() - 1"
        x-cloak
        @click="navigateNext()"
      >
        <i data-lucide="chevron-right" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Backdrop -->
    <form method="dialog" class="modal-backdrop">
      <button>close</button>
    </form>
  </dialog>

  <script>
    function fileViewerModal() {
      const VIEWER_PREFS_URL = '/api/v1/settings/files/viewer';
      let _prefsSaveTimer = null;

      return {
        ...viewerPanelMixin(),
        open: false,
        fileUuid: null,
        fileName: '',
        fileType: '',
        expanded: false,

        _getViewableFiles() {
          const rows = document.querySelectorAll('[data-uuid][data-viewable="1"][data-node-type="file"]');
          return Array.from(rows)
            .filter(function(r) { return r.offsetParent !== null; })
            .map(function(r) {
              return {
                uuid: r.dataset.uuid,
                name: r.dataset.displayName,
                fileType: r.dataset.fileType,
              };
            });
        },

        navigateNext() {
          const files = this._getViewableFiles();
          const idx = files.findIndex(f => f.uuid === this.fileUuid);
          if (idx >= 0 && idx < files.length - 1) {
            const next = files[idx + 1];
            this.openFile(next.uuid, next.name, next.fileType);
          }
        },

        navigatePrev() {
          const files = this._getViewableFiles();
          const idx = files.findIndex(f => f.uuid === this.fileUuid);
          if (idx > 0) {
            const prev = files[idx - 1];
            this.openFile(prev.uuid, prev.name, prev.fileType);
          }
        },

        _currentIndex() {
          // Read the reactive uuid before querying the DOM so these bindings
          // re-evaluate when the viewer opens, even if the file list was
          // empty (or not yet swapped in) when Alpine initialized.
          const current = this.fileUuid;
          const files = this._getViewableFiles();
          return files.findIndex(f => f.uuid === current);
        },

        _totalViewable() {
          void this.fileUuid;
          return this._getViewableFiles().length;
        },

        toggleExpanded() {
          this.expanded = !this.expanded;
          this._saveViewerPrefs();
        },

        _saveViewerPrefs() {
          const prefs = { expanded: this.expanded };
          clearTimeout(_prefsSaveTimer);
          _prefsSaveTimer = setTimeout(function() {
            fetch(VIEWER_PREFS_URL, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
              body: JSON.stringify({ value: prefs }),
            }).catch(function() {});
          }, 500);
        },

        async openFile(uuid, name, fileType, updateUrl = true) {
          this.fileUuid = uuid;
          this.fileName = name || 'File';
          this.fileType = fileType || '';
          this.open = true;
          this.$refs.dialog.showModal();

          // Update URL with open parameter
          if (updateUrl) {
            const url = new URL(window.location);
            url.searchParams.set('open', uuid);
            window.history.pushState({}, '', url);
          }

          await this.loadViewerPanel(`/files/view/${uuid}`);
        },

        // Shared by close() and the popstate handler: everything a close
        // does except touching the history.
        _resetViewer() {
          this.clearViewerPanel();
          this.$refs.dialog.close();
          this.open = false;
          this.fileUuid = null;
          this.fileName = '';
          this.fileType = '';
          this.viewerError = null;
        },

        close() {
          this._resetViewer();

          // Remove open parameter from URL
          const url = new URL(window.location);
          url.searchParams.delete('open');
          window.history.pushState({}, '', url);
        },

        handleKeydown(event) {
          if (!this.open) return;

          if (event.key === 'Escape') {
            this.close();
          }

          // Arrow navigation — skip if focus is in an editable element
          if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
            const tag = document.activeElement && document.activeElement.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            if (document.activeElement && document.activeElement.isContentEditable) return;

            event.preventDefault();
            if (event.key === 'ArrowLeft') {
              this.navigatePrev();
            } else {
              this.navigateNext();
            }
          }
        },

        async _openFileFromUuid(fileUuid) {
          if (!isValidUuid(fileUuid)) return;
          try {
            const response = await fetch('/api/v1/files/' + fileUuid);
            if (response.ok) {
              const fileData = await response.json();
              this.openFile(fileData.uuid, fileData.name, fileData.type, false);
            }
          } catch (err) {
            console.error('Failed to open file from URL:', err);
          }
        },

        async init() {
          // Prevent multiple initializations
          if (this._initialized) {
            return;
          }
          this._initialized = true;

          // Initial viewer prefs are embedded server-side via |json_script
          // (see index.html). Reading from the DOM avoids a redundant fetch
          // and the 404 a fresh user would hit on the settings endpoint.
          const prefsEl = document.getElementById('viewer-prefs-data');
          if (prefsEl) {
            try {
              const initial = JSON.parse(prefsEl.textContent) || {};
              if (initial.expanded !== undefined) this.expanded = initial.expanded;
            } catch (_) {}
          }

          this._keydownHandler = (e) => this.handleKeydown(e);
          this._openFileHandler = (e) => {
            const { uuid, name, type } = e.detail;
            this.openFile(uuid, name, type);
          };

          this._fileUpdatedHandler = (e) => {
            if (this.open && this.fileUuid && e.detail && e.detail.file_uuid === this.fileUuid) {
              this.openFile(this.fileUuid, this.fileName, this.fileType, false);
            }
          };

          this._lockReleasedHandler = (e) => {
            if (this.open && this.fileUuid && e.detail && e.detail.file_uuid === this.fileUuid) {
              this.openFile(this.fileUuid, this.fileName, this.fileType, false);
            }
          };

          window.addEventListener('keydown', this._keydownHandler);
          window.addEventListener('open-file-viewer', this._openFileHandler);
          window.addEventListener('sse:files.file_updated', this._fileUpdatedHandler);
          window.addEventListener('sse:files.lock_released', this._lockReleasedHandler);

          this._detachSwipe = window.attachSwipeNavigation(this.$refs.dialog, {
            onPrev: () => this.navigatePrev(),
            onNext: () => this.navigateNext(),
          });

          // Handle browser back/forward navigation
          this._popStateHandler = async (event) => {
            const urlParams = new URLSearchParams(window.location.search);
            const fileUuid = urlParams.get('open');

            if (fileUuid && fileUuid !== this.fileUuid) {
              await this._openFileFromUuid(fileUuid);
            } else if (!fileUuid && this.open) {
              // No open parameter but viewer is open - close it
              this._resetViewer();
            }
          };
          window.addEventListener('popstate', this._popStateHandler);

          // Check if there's an open parameter in URL and open it
          const urlParams = new URLSearchParams(window.location.search);
          const fileUuid = urlParams.get('open');
          if (fileUuid) {
            await this._openFileFromUuid(fileUuid);
          }
        }
      };
    }
  </script>
</div>
