{% load i18n %}
<!-- Create Folder Dialog -->
<dialog id="create-folder-dialog" class="modal">
  <div class="modal-box" x-data="{ folderName: '' }">
    {% translate "Create New Folder" as create_folder_title %}
    {% include "ui/partials/dialog_header.html" with icon="folder-plus" title=create_folder_title only %}
    <form
      @submit.prevent="window.dispatchEvent(new CustomEvent('create-folder', { detail: { name: folderName } }))"
    >
      <div class="form-control">
        <label class="label">
          <span class="label-text">{% translate "Folder name" %}</span>
        </label>
        <input
          x-model="folderName"
          type="text"
          placeholder="{% translate 'New folder' %}"
          class="input input-bordered w-full"
          required
        />
      </div>
      <div class="modal-action">
        <button
          type="button"
          class="btn btn-sm"
          onclick="document.getElementById('create-folder-dialog').close()"
        >
          {% translate "Cancel" %}
        </button>
        <button type="submit" class="btn btn-module btn-sm">{% translate "Create" %}</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit">{% translate "close" %}</button>
  </form>
</dialog>
