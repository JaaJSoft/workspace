{% load i18n %}
{# Re-rendered with the sidebar's group folders (group_folders_refresh.html), so a group that just got its folder leaves the list. #}
<div id="group-folder-choices">
  {% if available_groups %}
    <form
      @submit.prevent="if (selectedGroup) { window.dispatchEvent(new CustomEvent('create-group-folder', { detail: { groupId: parseInt(selectedGroup), groupName: $refs.groupSelect.options[$refs.groupSelect.selectedIndex].text } })); }"
    >
      <div class="fieldset">
        <label class="fieldset-legend">
          <span>{% translate "Group" %}</span>
        </label>
        <select
          x-model="selectedGroup"
          x-ref="groupSelect"
          class="select w-full"
          required
        >
          <option value="" disabled selected>{% translate "Select a group" %}</option>
          {% for g in available_groups %}
            <option value="{{ g.id }}">{{ g.name }}</option>
          {% endfor %}
        </select>
        <label class="label whitespace-normal">
          <span>{% translate "The folder will be named after the group" %}</span>
        </label>
      </div>
      <div class="modal-action">
        <button
          type="button"
          class="btn btn-sm"
          onclick="document.getElementById('create-group-folder-dialog').close()"
        >
          {% translate "Cancel" %}
        </button>
        <button
          type="submit"
          class="btn btn-module btn-sm"
          :disabled="!selectedGroup"
        >
          {% translate "Create" %}
        </button>
      </div>
    </form>
  {% else %}
    <p class="text-base-content/60 text-sm">{% translate "All your groups already have a folder." %}</p>
    <div class="modal-action">
      <button
        type="button"
        class="btn btn-sm"
        onclick="document.getElementById('create-group-folder-dialog').close()"
      >
        {% translate "Close" %}
      </button>
    </div>
  {% endif %}
</div>
