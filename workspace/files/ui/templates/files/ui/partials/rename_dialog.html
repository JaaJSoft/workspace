{% load i18n %}
<!-- Rename Dialog -->
<dialog id="rename-dialog" class="modal">
  <div
    class="modal-box"
    x-data="{ uuid: '', name: '' }"
    @open-rename.window="uuid = $event.detail.uuid; name = $event.detail.name"
  >
    {% translate "Rename" as rename_title %}
    {% include "ui/partials/dialog_header.html" with icon="pencil" title=rename_title only %}
    <form
      @submit.prevent="window.dispatchEvent(new CustomEvent('rename-item', { detail: { uuid: uuid, name: name } }))"
    >
      <div class="form-control">
        <label class="label">
          <span class="label-text">{% translate "New name" %}</span>
        </label>
        <input
          x-model="name"
          type="text"
          class="input input-bordered w-full"
          required
        />
      </div>
      <div class="modal-action">
        <button
          type="button"
          class="btn btn-sm"
          onclick="document.getElementById('rename-dialog').close()"
        >
          {% translate "Cancel" %}
        </button>
        <button type="submit" class="btn btn-module btn-sm">{% translate "Rename" %}</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit">{% translate "close" %}</button>
  </form>
</dialog>
