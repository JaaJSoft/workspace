{% comment %}
  The anonymous drop zone, shared between shared_folder.html (both mode) and
  shared_drop.html (drop-only mode). Needs share_token, access_token and
  max_file_bytes in context.
{% endcomment %}
<div
  data-testid="drop-zone"
  data-share-token="{{ share_token }}"
  data-access-token="{{ access_token }}"
  data-max-file-bytes="{{ max_file_bytes|default:0 }}"
  x-data="sharedDrop($el.dataset.shareToken, $el.dataset.accessToken, Number($el.dataset.maxFileBytes))"
  class="card bg-base-100 shadow-lg"
>
  <div class="card-body">
    <h2 class="text-lg font-bold mb-2 flex items-center gap-2">
      <i data-lucide="upload-cloud" class="w-5 h-5"></i>
      Send files
    </h2>

    <label
      class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-base-300 rounded-lg p-8 cursor-pointer hover:border-primary transition-colors"
      @dragover.prevent
      @drop.prevent="drop($event)"
    >
      <i data-lucide="upload" class="w-10 h-10 text-base-content/40"></i>
      <span class="text-base-content/60 text-sm">Drag files here or click to browse</span>
      <input type="file" multiple class="hidden" @change="pick($event)" />
    </label>

    <ul x-show="queue.length > 0" x-cloak class="mt-4 space-y-2">
      <template x-for="(item, index) in queue" :key="index">
        <li class="flex items-center justify-between gap-2 text-sm">
          <span class="truncate" x-text="item.name"></span>
          <span
            class="badge badge-sm"
            :class="{
              'badge-ghost': item.state === 'pending',
              'badge-info': item.state === 'sending',
              'badge-success': item.state === 'done',
              'badge-error': item.state === 'failed',
              'badge-warning': item.state === 'too-large',
            }"
            x-text="stateLabel(item.state)"
          ></span>
        </li>
      </template>
    </ul>

    <div data-testid="drop-done" x-show="doneCount() > 0" x-cloak class="mt-4">
      <inline-alert type="success" message="Files uploaded successfully."></inline-alert>
    </div>
  </div>
</div>
