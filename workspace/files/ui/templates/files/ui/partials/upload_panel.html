{% comment %}
  The upload queue (Alpine store `uploads`, files/ui/js/upload_queue.js).
  Sits outside #folder-browser so it survives folder navigation, and stays
  until the user closes it so a failed or skipped file is never missed.
{% endcomment %}
<section
  x-data
  x-show="$store.uploads.items.length"
  x-cloak
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  class="fixed bottom-4 right-4 z-40 w-96 max-w-[calc(100vw-2rem)] flex flex-col overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-xl"
  aria-label="Uploads"
  data-testid="upload-panel"
>
  <header class="flex items-center gap-3 bg-base-200 px-4 py-3">
    <span
      class="shrink-0"
      :class="$store.uploads.pendingCount ? 'text-module' : ($store.uploads.failedCount ? 'text-error' : 'text-success')"
    >
      <i
        :data-lucide="$store.uploads.pendingCount ? 'cloud-upload' : ($store.uploads.failedCount ? 'circle-alert' : 'circle-check')"
        class="w-5 h-5"
      ></i>
    </span>
    <div class="flex-1 min-w-0" aria-live="polite">
      <p class="truncate text-sm font-semibold" x-text="$store.uploads.title"></p>
      <p
        x-show="$store.uploads.pendingCount"
        class="text-xs tabular-nums text-base-content/60"
        x-text="formatFileSize($store.uploads.progress.loaded) + ' of ' + formatFileSize($store.uploads.progress.total) + ' - ' + $store.uploads.progress.percent + '%'"
      ></p>
    </div>
    <div class="flex shrink-0 items-center">
      <button
        type="button"
        x-show="$store.uploads.pendingCount && !$store.uploads.paused"
        class="btn btn-ghost btn-xs btn-square"
        title="Pause"
        aria-label="Pause uploads"
        @click="$store.uploads.pause()"
      >
        <i data-lucide="pause" class="w-4 h-4"></i>
      </button>
      <button
        type="button"
        x-show="$store.uploads.pendingCount && $store.uploads.paused"
        class="btn btn-ghost btn-xs btn-square"
        title="Resume"
        aria-label="Resume uploads"
        @click="$store.uploads.resume()"
      >
        <i data-lucide="play" class="w-4 h-4"></i>
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-xs btn-square"
        :title="$store.uploads.expanded ? 'Collapse' : 'Expand'"
        :aria-expanded="$store.uploads.expanded"
        aria-controls="upload-panel-list"
        @click="$store.uploads.expanded = !$store.uploads.expanded"
      >
        <i
          :data-lucide="$store.uploads.expanded ? 'chevron-down' : 'chevron-up'"
          class="w-4 h-4"
        ></i>
      </button>
      <button
        type="button"
        class="btn btn-ghost btn-xs btn-square"
        title="Close"
        aria-label="Close uploads"
        @click="$store.uploads.close()"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </header>
  <div x-show="$store.uploads.pendingCount" class="h-1 bg-base-300">
    <div
      class="h-full bg-module transition-[width] duration-150"
      :style="{ width: $store.uploads.progress.percent + '%' }"
    ></div>
  </div>
  <ul
    id="upload-panel-list"
    x-effect="$store.uploads.pendingCount || ($el.scrollTop = 0)"
    x-show="$store.uploads.expanded"
    class="max-h-48 sm:max-h-72 divide-y divide-base-200 overflow-y-auto"
  >
    <template x-for="item in $store.uploads.rows" :key="item.id">
      <li
        class="flex items-center gap-3 px-4 py-2"
        :data-status="item.status"
        x-effect="item.status === 'uploading' && $store.uploads.expanded && $el.scrollIntoView({ block: 'nearest' })"
      >
        <span class="flex h-5 w-5 shrink-0 items-center justify-center">
          {# x-show, not x-if: Lucide swaps the <i> for an svg, and x-if would later remove the <i> it no longer finds, leaving the svg behind. #}
          <span
            x-show="item.status === 'uploading'"
            class="loading loading-spinner loading-xs text-module"
          ></span>
          <i
            x-show="item.status !== 'uploading'"
            :data-lucide="$store.uploads.statusIcon(item)"
            class="w-4 h-4"
            :class="$store.uploads.statusTone(item)"
          ></i>
        </span>
        <div class="flex-1 min-w-0">
          <p class="truncate text-sm" :title="item.name" x-text="item.name"></p>
          <p
            class="truncate text-xs"
            :class="item.status === 'failed' ? 'text-error' : 'text-base-content/60'"
            :title="$store.uploads.statusText(item)"
            x-text="$store.uploads.statusText(item)"
          ></p>
          <div
            x-show="item.status === 'uploading'"
            class="mt-1 h-1 overflow-hidden rounded-full bg-base-300"
          >
            <div
              class="h-full bg-module transition-[width] duration-150"
              :style="{ width: (item.size ? Math.floor(item.loaded / item.size * 100) : 0) + '%' }"
            ></div>
          </div>
          <div
            x-show="item.status === 'done' && item.duplicates.length"
            class="mt-1 flex gap-2"
          >
            <button
              type="button"
              class="btn btn-warning btn-xs"
              @click="$store.uploads.discard(item.id)"
            >
              Discard upload
            </button>
            <button
              type="button"
              class="btn btn-ghost btn-xs"
              @click="$store.uploads.keep(item.id)"
            >
              Keep both
            </button>
          </div>
        </div>
        <button
          type="button"
          x-show="item.status === 'queued' || item.status === 'uploading'"
          class="btn btn-ghost btn-xs btn-square shrink-0"
          title="Cancel"
          :aria-label="'Cancel ' + item.name"
          @click="$store.uploads.cancel(item.id)"
        >
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <button
          type="button"
          x-show="item.status === 'failed' || item.status === 'cancelled'"
          class="btn btn-ghost btn-xs btn-square shrink-0"
          title="Retry"
          :aria-label="'Retry ' + item.name"
          @click="$store.uploads.retry(item.id)"
        >
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
      </li>
    </template>
  </ul>
</section>
