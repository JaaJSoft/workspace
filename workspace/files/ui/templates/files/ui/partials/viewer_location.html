{% comment %}
  The folder of the file in a Files viewer header, inside the shell's scope
  (fileViewerShellMixin in file_viewer.js): a link to it in Files, or plain
  text for a file only shared with the viewer.
{% endcomment %}
<template x-if="fileLocation">
  <a
    :href="fileLocation.url || null"
    :title="locationTitle()"
    class="flex items-center gap-1 min-w-0 text-xs text-base-content/60"
    :class="{ 'hover:text-base-content hover:underline': fileLocation.url }"
    data-viewer-location-link
  >
    <template x-if="fileLocation.space === 'group'">
      <i data-lucide="users" class="w-3 h-3 shrink-0"></i>
    </template>
    <template x-if="fileLocation.space === 'shared'">
      <i data-lucide="share-2" class="w-3 h-3 shrink-0"></i>
    </template>
    <template x-if="fileLocation.space === 'personal'">
      <i data-lucide="folder" class="w-3 h-3 shrink-0"></i>
    </template>
    <span class="truncate" x-text="locationLabel()"></span>
  </a>
</template>
