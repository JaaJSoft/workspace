{% load i18n %}
{% comment %}
  The reader runs in a page of its own, framed here: its Content-Security-Policy
  is what keeps the book's scripts from running (see FILES_EBOOK_READER_CSP).
{% endcomment %}
<div class="flex flex-col h-full">
  <div
    class="flex items-center justify-center gap-2 p-2 bg-base-100 border-b border-base-300"
  >
    <a
      href="{{ reader_url }}"
      target="_blank"
      rel="noopener"
      class="btn btn-sm btn-ghost"
      title="{% translate 'Open in new tab' %}"
    >
      <i data-lucide="external-link" class="w-4 h-4"></i>
      <span class="hidden sm:inline">{% translate "New tab" %}</span>
    </a>
  </div>

  <iframe
    src="{{ reader_url }}"
    class="flex-1 w-full border-none bg-base-100"
    title="{{ file.name }}"
    data-ebook-reader
  ></iframe>
</div>
