{% load i18n %}
<div class="flex flex-col h-full items-center justify-center gap-4 p-8">
  <inline-alert type="info" title="{% translate 'Too large to read here' %}" message="{% blocktranslate trimmed with name=file.name max_size=max_bytes|filesizeformat %}{{ name }} is larger than {{ max_size }}, the most the reader opens. Download it to read it in an e-book app.{% endblocktranslate %}"></inline-alert>
  <a href="{{ content_url }}" download class="btn btn-sm btn-module">
    <i data-lucide="download" class="w-4 h-4"></i>
    {% translate "Download" %}
  </a>
</div>
