{% load i18n %}
<div class="flex flex-col h-full items-center justify-center gap-4 p-8">
  <inline-alert type="warning" title="{% translate 'Preview unavailable' %}" message="{% translate 'The document editor is not reachable or does not support this format. You can still download the file.' %}"></inline-alert>
  <a
    href="/api/v1/files/{{ file.uuid }}/download"
    class="btn btn-sm btn-module"
  >
    <i data-lucide="download" class="w-4 h-4"></i>
    {% translate "Download" %}
  </a>
</div>
