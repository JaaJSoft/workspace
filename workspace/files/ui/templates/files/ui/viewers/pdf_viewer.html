<!-- PDF Viewer (native browser) -->
<div class="flex flex-col h-full" x-data="pdfViewerData()">
  {% include "files/ui/viewers/new_tab_marker.html" %}

  <!-- PDF iframe -->
  <iframe
    src="{{ content_url }}"
    class="flex-1 w-full border-none bg-base-200"
    title="{{ file.name }}"
    @load="onLoad()"
  ></iframe>

  <!-- Loading overlay (shown until iframe loads) -->
  <div
    x-show="loading"
    class="absolute inset-0 flex items-center justify-center bg-base-200/80 z-10"
    x-cloak
  >
    <span class="loading loading-spinner loading-lg"></span>
  </div>
</div>

<script>
  window.pdfViewerData = function pdfViewerData() {
    return {
      loading: true,

      onLoad() {
        this.loading = false;
      },
    };
  };
</script>
