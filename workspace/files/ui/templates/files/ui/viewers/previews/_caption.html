{# The line under a media preview; a host that shows the media alone sets <file-preview bare>. #}
<div
  class="file-preview-caption flex items-center gap-2 min-w-0 mt-1 text-sm opacity-75"
>
  <i data-lucide="{{ icon }}" class="w-4 h-4 shrink-0"></i>
  <span class="file-preview-name truncate min-w-0">{{ name }}</span>
</div>
