{% load i18n %}
<div class="flex flex-col h-full items-center justify-center gap-4 p-8">
  <inline-alert type="info" title="{% translate 'Too large to preview' %}" message="{% blocktranslate trimmed with name=file.name max_size=max_bytes|filesizeformat %}{{ name }} is larger than {{ max_size }}, the most the editor opens. You can still read it as plain text in a new tab.{% endblocktranslate %}"></inline-alert>
  <a
    href="{{ content_url }}"
    target="_blank"
    rel="noopener"
    class="btn btn-sm btn-module"
  >
    <i data-lucide="external-link" class="w-4 h-4"></i>
    {% translate "Open as plain text" %}
  </a>
</div>
