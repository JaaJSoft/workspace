{# Header buttons of the rules dialog: view density and "New rule", list mode only. #}
{% load i18n %}
{% translate "Switch to comfortable view" as comfortable_label %}
{% translate "Switch to compact view" as compact_label %}
<div
  class="flex items-center gap-2 shrink-0"
  x-show="rulesEditing === null && rulesApplying === null"
>
  <button
    type="button"
    class="btn btn-ghost btn-sm btn-square"
    :title="mailPrefs.rulesCompact ? '{{ comfortable_label|escapejs }}' : '{{ compact_label|escapejs }}'"
    :aria-label="mailPrefs.rulesCompact ? '{{ comfortable_label|escapejs }}' : '{{ compact_label|escapejs }}'"
    @click="rulesToggleCompact()"
  >
    <i
      :data-lucide="mailPrefs.rulesCompact ? 'rows-2' : 'rows-3'"
      class="w-4 h-4"
    ></i>
  </button>
  <button
    type="button"
    class="btn btn-module btn-sm"
    @click="rulesOpenForm()"
    aria-label="{% translate "New rule" %}"
  >
    <i data-lucide="plus" class="w-4 h-4"></i>
    <span class="hidden sm:inline">{% translate "New rule" %}</span>
  </button>
</div>
