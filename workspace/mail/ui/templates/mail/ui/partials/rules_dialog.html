{% load i18n %}
<!-- Mail rules management dialog (per-account) -->
<dialog id="mail-rules-dialog" class="modal">
  <div class="modal-box max-w-3xl">
    {% translate "Filters & Rules" as rules_title %}
    {% include "ui/partials/dialog_header.html" with icon="filter" title=rules_title subtitle_expr="rulesAccount && rulesAccount.email" actions_template="mail/ui/partials/_rules_header_actions.html" only %}

    <!-- List mode -->
    <template x-if="rulesEditing === null && rulesApplying === null">
      <div class="space-y-2">
        <template x-if="!rulesList.length">
          <inline-alert type="info" message="{% translate "No rules yet. Click 'New rule' to create one." %}"></inline-alert>
        </template>

        <template x-if="rulesList.length > 0">
          <input
            type="text"
            x-model="rulesSearch"
            placeholder="{% translate "Filter by name or action type..." %}"
            class="input input-sm w-full"
          />
        </template>

        <ul
          :class="mailPrefs.rulesCompact ? 'space-y-1' : 'space-y-2'"
          x-show="filteredRulesList().length"
        >
          <template x-for="rule in filteredRulesList()" :key="rule.uuid">
            <li
              class="bg-base-100 border border-base-300 rounded-lg flex flex-row items-center gap-3"
              :class="mailPrefs.rulesCompact ? 'px-3 py-1.5' : 'p-3'"
            >
              <div class="flex-1 min-w-0">
                <div
                  class="font-medium truncate"
                  :class="mailPrefs.rulesCompact ? 'text-sm' : ''"
                  x-text="rule.name"
                ></div>
                <div
                  x-show="!mailPrefs.rulesCompact"
                  class="text-xs text-base-content/60 truncate"
                  x-text="rulesDescribe(rule)"
                ></div>
              </div>
              <!-- Reorder arrows: hidden during search so positions are unambiguous -->
              <div x-show="!rulesSearch.trim()" class="join join-vertical shrink-0">
                <button
                  type="button"
                  x-show="rulesCanMoveUp(rule)"
                  class="btn btn-ghost btn-xs join-item"
                  @click="rulesMove(rule, -1)"
                  title="{% translate "Move up" %}"
                  aria-label="{% translate "Move rule up" %}"
                >
                  <i data-lucide="chevron-up" class="w-4 h-4"></i>
                </button>
                <button
                  type="button"
                  x-show="rulesCanMoveDown(rule)"
                  class="btn btn-ghost btn-xs join-item"
                  @click="rulesMove(rule, 1)"
                  title="{% translate "Move down" %}"
                  aria-label="{% translate "Move rule down" %}"
                >
                  <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
              </div>
              {% translate "Disable rule %(name)s" as disable_rule_label %}
              {% translate "Enable rule %(name)s" as enable_rule_label %}
              <input
                type="checkbox"
                class="toggle toggle-sm toggle-module shrink-0"
                :checked="rule.is_enabled"
                :aria-label="interpolate(rule.is_enabled ? '{{ disable_rule_label|escapejs }}' : '{{ enable_rule_label|escapejs }}', { name: rule.name }, true)"
                @change="rulesToggle(rule, $event.target.checked)"
              />
              <button
                type="button"
                class="btn btn-ghost btn-xs btn-square shrink-0"
                @click="rulesOpenApply(rule)"
                title="{% translate "Apply to a folder" %}"
                aria-label="{% translate "Apply rule to a folder" %}"
              >
                <i data-lucide="play" class="w-4 h-4"></i>
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-xs btn-square shrink-0"
                @click="rulesOpenForm(rule)"
                title="{% translate "Edit" %}"
                aria-label="{% translate "Edit rule" %}"
              >
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button
                type="button"
                class="btn btn-ghost btn-xs btn-square text-error shrink-0"
                @click="rulesDelete(rule)"
                title="{% translate "Delete" %}"
                aria-label="{% translate "Delete rule" %}"
              >
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </li>
          </template>
        </ul>

        <template x-if="rulesList.length > 0 && filteredRulesList().length === 0">
          <p class="text-base-content/60 text-sm py-4 text-center">{% translate "No rules match the filter." %}</p>
        </template>
      </div>
    </template>

    <!-- Apply-to-folder sub-view -->
    <template x-if="rulesApplying !== null">
      <div class="space-y-4">
        <div>
          <h4 class="font-semibold">{% translate "Apply rule to a folder" %}</h4>
          <p
            class="text-sm text-base-content/60 truncate"
            x-text="rulesApplying && rulesApplying.name"
          ></p>
        </div>

        <div class="space-y-2">
          <div class="text-sm font-semibold">{% translate "Folder" %}</div>
          {% include "mail/ui/partials/_folder_list.html" with model="rulesApplyFolderId" on_change="rulesApplyResult = null" %}
          <p
            class="text-xs text-base-content/60"
          >{% translate "Scans the 500 most recent messages of the folder." %}</p>
        </div>

        <template x-if="rulesApplyResult">
          <div
            class="bg-base-200 border border-base-300 rounded-lg p-3 text-sm space-y-1"
          >
            <div x-text="rulesApplyText('matched')"></div>
            <div
              x-show="rulesApplyResult.applied_run"
              x-text="rulesApplyText('applied')"
            ></div>
            <div
              x-show="rulesApplyResult.applied_run && rulesApplyResult.imap_failed > 0"
              class="text-error"
              x-text="rulesApplyText('failed')"
            ></div>
            <div
              x-show="rulesApplyResult.capped"
              class="text-warning"
              x-text="rulesApplyText('capped')"
            ></div>
          </div>
        </template>

        <div class="modal-action">
          <button
            type="button"
            class="btn btn-ghost btn-sm"
            @click="rulesCancelApply()"
            :disabled="rulesApplyBusy"
          >
            {% translate "Back" %}
          </button>
          <button
            type="button"
            class="btn btn-sm"
            @click="rulesPreviewApply()"
            :disabled="!rulesApplyFolderId || rulesApplyBusy"
          >
            <span x-show="rulesApplyBusy !== 'preview'">{% translate "Preview" context "rule dry run" %}</span>
            <span
              x-show="rulesApplyBusy === 'preview'"
              class="loading loading-spinner loading-xs"
            ></span>
          </button>
          <button
            type="button"
            class="btn btn-warning btn-sm"
            @click="rulesRunApply()"
            :disabled="!rulesApplyFolderId || rulesApplyBusy"
          >
            <span x-show="rulesApplyBusy !== 'run'">{% translate "Apply now" %}</span>
            <span
              x-show="rulesApplyBusy === 'run'"
              class="loading loading-spinner loading-xs"
            ></span>
          </button>
        </div>
      </div>
    </template>

    <!-- Edit/Create form -->
    <template x-if="rulesEditing !== null">
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          {% translate "Edit rule" as edit_rule_title %}
          {% translate "New rule" as new_rule_title %}
          <h4
            class="font-semibold"
            x-text="rulesEditing.uuid ? '{{ edit_rule_title|escapejs }}' : '{{ new_rule_title|escapejs }}'"
          ></h4>
          <div class="tabs tabs-box">
            <button
              type="button"
              class="tab tab-sm tab-module"
              :class="rulesForm.mode === 'simple' ? 'tab-active' : ''"
              @click="rulesSetMode('simple')"
            >
              {% translate "Simple" context "rule editor mode" %}
            </button>
            <button
              type="button"
              class="tab tab-sm tab-module"
              :class="rulesForm.mode === 'advanced' ? 'tab-active' : ''"
              @click="rulesSetMode('advanced')"
            >
              {% translate "Advanced" context "rule editor mode" %}
            </button>
          </div>
        </div>

        <input
          type="text"
          class="input w-full"
          placeholder="{% translate "Rule name" %}"
          x-model="rulesEditing.name"
        />

        <div x-show="rulesForm.mode === 'simple'" class="space-y-2">
          <div class="text-sm font-semibold">{% translate "When" context "rule condition" %}</div>
          <div
            class="grid grid-cols-1 sm:grid-cols-[10rem_10rem_1fr] gap-2 items-stretch"
          >
            <select
              class="select select-sm min-w-0 w-full"
              x-model="rulesForm.simpleCondition.field"
              @change="rulesOnFieldChange()"
            >
              <template x-for="f in rulesConditionFields" :key="f.value">
                <option :value="f.value" x-text="f.label"></option>
              </template>
            </select>
            <select
              class="select select-sm min-w-0 w-full"
              x-model="rulesForm.simpleCondition.op"
            >
              <template
                x-for="o in rulesCompatibleOps(rulesForm.simpleCondition.field)"
                :key="o"
              >
                <option :value="o" x-text="rulesOpLabel(o)"></option>
              </template>
            </select>
            <input
              x-show="rulesNeedsValue(rulesForm.simpleCondition.op)"
              type="text"
              class="input input-sm min-w-0 w-full"
              x-model="rulesForm.simpleCondition.value"
            />
          </div>

          <div class="text-sm font-semibold mt-3">{% translate "Then" context "rule action" %}</div>
          <div class="flex flex-wrap gap-2 items-stretch">
            <select
              class="select select-sm w-full sm:w-44 sm:shrink-0"
              x-model="rulesForm.simpleAction.type"
            >
              <option value="mark_read">{% translate "Mark as read" %}</option>
              <option value="mark_unread">{% translate "Mark as unread" %}</option>
              <option value="star">{% translate "Star" context "verb" %}</option>
              <option value="unstar">{% translate "Unstar" %}</option>
              <option value="add_label">{% translate "Add label" %}</option>
              <option value="remove_label">{% translate "Remove label" %}</option>
              <option value="move_to_folder">{% translate "Move to folder" %}</option>
              <option value="delete">{% translate "Delete" %}</option>
            </select>
            <select
              x-show="rulesForm.simpleAction.type === 'add_label' || rulesForm.simpleAction.type === 'remove_label'"
              class="select select-sm w-full sm:flex-1 sm:w-auto sm:min-w-0"
              x-model="rulesForm.simpleAction.label_id"
            >
              <template x-for="lbl in rulesAccountLabels()" :key="lbl.uuid">
                <option :value="lbl.uuid" x-text="lbl.name"></option>
              </template>
            </select>
            {% include "mail/ui/partials/_folder_list.html" with model="rulesForm.simpleAction.folder_id" x_show="rulesForm.simpleAction.type === 'move_to_folder'" class="basis-full" %}
          </div>
        </div>

        <div x-show="rulesForm.mode === 'advanced'" class="space-y-2">
          <div class="flex items-center justify-between">
            <div class="text-sm font-semibold">{% translate "Conditions (JSON tree)" %}</div>
            <button
              type="button"
              class="btn btn-ghost btn-xs gap-1"
              :class="rulesShowAdvancedHelp ? 'text-module' : 'text-base-content/60'"
              @click="rulesShowAdvancedHelp = !rulesShowAdvancedHelp"
            >
              <i data-lucide="help-circle" class="w-4 h-4"></i>
              {% translate "Hide syntax help" as hide_syntax_label %}
              {% translate "Show syntax help" as show_syntax_label %}
              <span
                x-text="rulesShowAdvancedHelp ? '{{ hide_syntax_label|escapejs }}' : '{{ show_syntax_label|escapejs }}'"
              ></span>
            </button>
          </div>

          <!-- Help panel: rendered right below the toggle so the click target -->
          <!-- and the result stay in the same area of the dialog.            -->
          <div
            x-show="rulesShowAdvancedHelp"
            x-cloak
            class="bg-base-200 border border-base-300 rounded-lg p-3 text-xs space-y-3"
          >
            <div>
              <div class="font-semibold mb-1">{% translate "Conditions" %}</div>
              <p class="text-base-content/70 mb-2">
                {% translate "A condition is either a single check (leaf) or a group combining multiple checks with AND/OR." %}
              </p>
              <div
                class="font-mono bg-base-100 border border-base-300 rounded-sm p-2 mb-2 whitespace-pre-wrap"
              >
                {"field": "from", "op": "contains", "value": "@news.com"}
              </div>
              <div
                class="font-mono bg-base-100 border border-base-300 rounded-sm p-2 whitespace-pre-wrap"
              >
                {"type": "all", "conditions": [
                {"field": "from", "op": "contains", "value": "@github.com"},
                {"type": "any", "conditions": [
                {"field": "subject", "op": "contains", "value": "[review]"},
                {"field": "is_starred", "op": "is_true"}
                ]}
                ]}
              </div>
            </div>
            <div>
              <div class="font-semibold mb-1">{% translate "Available fields" %}</div>
              <p class="text-base-content/70">
                {% blocktranslate trimmed %}
                  <span class="font-mono">from, to, cc, recipient, subject, body, folder</span> (text);
                  <span class="font-mono">has_attachments, is_starred</span> (boolean);
                  <span class="font-mono">date</span> (ISO 8601).
                {% endblocktranslate %}
              </p>
            </div>
            <div>
              <div class="font-semibold mb-1">{% translate "Available ops" %}</div>
              <p class="text-base-content/70">
                {% blocktranslate trimmed %}
                  Text: <span class="font-mono">contains, equals, starts_with, ends_with, matches_regex, in_list</span>.
                  Boolean: <span class="font-mono">is_true, is_false</span>.
                  Date: <span class="font-mono">greater_than, less_than</span>.
                {% endblocktranslate %}
              </p>
              <p class="text-base-content/70 mt-1">
                {% blocktranslate trimmed %}
                  Add <span class="font-mono">"case_sensitive": true</span>
                  to a text leaf for exact case matching (default: false).
                {% endblocktranslate %}
              </p>
            </div>
            <div>
              <div class="font-semibold mb-1">{% translate "Actions (flat list)" %}</div>
              <div
                class="font-mono bg-base-100 border border-base-300 rounded-sm p-2 whitespace-pre-wrap"
              >
                [
                {"type": "add_label", "label_id": "&lt;uuid&gt;"},
                {"type": "mark_read"},
                {"type": "move_to_folder", "folder_id": "&lt;uuid&gt;"}
                ]
              </div>
              <p class="text-base-content/70 mt-2">
                {% blocktranslate trimmed %}
                  Types: <span class="font-mono">add_label, remove_label</span>
                  (need <span class="font-mono">label_id</span>);
                  <span class="font-mono">mark_read, mark_unread, star, unstar, delete</span> (no args);
                  <span class="font-mono">move_to_folder</span> (needs <span class="font-mono">folder_id</span>).
                {% endblocktranslate %}
              </p>
              <p
                class="text-base-content/70 mt-1"
              >{% translate "Limits: max 5 nesting levels, max 20 leaf conditions per rule." %}</p>
            </div>
            <div>
              <div class="font-semibold mb-1">{% translate "Finding label/folder UUIDs" %}</div>
              <p class="text-base-content/70">{% translate "Use the Simple mode to pick a label or folder, then switch to Advanced to see its UUID inlined in the JSON." %}</p>
            </div>
          </div>

          <textarea
            class="textarea w-full font-mono text-xs"
            rows="6"
            x-model="rulesForm.advancedConditionsText"
            @input="rulesSyncAdvancedConditions()"
          ></textarea>

          <div class="text-sm font-semibold mt-3">{% translate "Actions (JSON list)" %}</div>
          <textarea
            class="textarea w-full font-mono text-xs"
            rows="8"
            x-model="rulesForm.advancedActionsText"
            @input="rulesSyncAdvancedActions()"
          ></textarea>
        </div>

        <div
          x-show="rulesForm.error"
          class="text-error text-xs"
          x-text="rulesForm.error"
        ></div>

        <label class="flex items-center gap-2 mt-3">
          <input
            type="checkbox"
            class="checkbox checkbox-sm checkbox-module"
            x-model="rulesEditing.is_enabled"
          />
          <span class="text-sm">{% translate "Enabled" context "rule" %}</span>
        </label>
        <label class="flex items-center gap-2">
          <input
            type="checkbox"
            class="checkbox checkbox-sm checkbox-module"
            x-model="rulesEditing.stop_processing"
          />
          <span class="text-sm">{% translate "Stop processing more rules after this one" %}</span>
        </label>

        <div class="modal-action">
          <button
            type="button"
            class="btn btn-ghost btn-sm"
            @click="rulesCancelEdit()"
            :disabled="rulesForm.saving"
          >
            {% translate "Back" %}
          </button>
          <button
            type="button"
            class="btn btn-module btn-sm"
            @click="rulesSave()"
            :disabled="!rulesEditing.name || rulesForm.saving"
          >
            <span x-show="!rulesForm.saving">{% translate "Save" %}</span>
            <span x-show="rulesForm.saving" class="loading loading-spinner loading-xs"></span>
          </button>
        </div>
      </div>
    </template>

    <div
      class="modal-action"
      x-show="rulesEditing === null && rulesApplying === null"
    >
      <form method="dialog">
        <button type="submit" class="btn btn-sm">{% translate "Close" %}</button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit">{% translate "close" %}</button>
  </form>
</dialog>
