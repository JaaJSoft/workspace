<a
  href="{% url 'people_ui:index' %}?person={{ person.uuid }}"
  class="flex items-center gap-3 px-4 py-2 hover:bg-base-200 border-b border-base-200"
  :class="{ 'bg-base-200': current === '{{ person.uuid }}' }"
  @click.prevent="openPerson('{{ person.uuid }}')"
  data-person-uuid="{{ person.uuid }}"
>
  {% if person.linked_user_id %}
    <user-avatar user-id="{{ person.linked_user_id }}" username="{{ person.linked_user.username }}" size="sm"></user-avatar>
  {% elif person.has_avatar %}
    <img
      src="/api/v1/people/{{ person.uuid }}/avatar"
      alt=""
      class="w-8 h-8 rounded-full object-cover"
    />
  {% else %}
    <div
      class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold bg-secondary/20 text-secondary"
    >
      {{ person.display_name|slice:":1"|upper }}
    </div>
  {% endif %}
  <div class="min-w-0 flex-1">
    <div class="flex items-center gap-1.5 truncate">
      <span class="font-medium truncate">{{ person.display_name }}</span>
      {% if person.group_id %}
        <i
          data-lucide="users-round"
          class="w-3.5 h-3.5 opacity-50 shrink-0"
          title="{{ person.group.name }}"
        ></i>
      {% endif %}
    </div>
    <div class="text-xs opacity-60 truncate">{{ person.primary_email|default:person.organization }}</div>
  </div>
</a>
