{% comment %}
  One contact of a picker menu: its face or a placeholder, its name and how
  many photos it has, inside an x-for. Alpine expressions: person_expr (the
  contact: name, cover_url, photo_count), click_expr, and disabled_expr when
  the list can be locked.
{% endcomment %}
<li>
  <button
    type="button"
    class="gap-3 rounded-sm"
    {% if disabled_expr %}:disabled="{{ disabled_expr }}"{% endif %}
    @click="{{ click_expr }}"
  >
    <template x-if="{{ person_expr }}.cover_url">
      <img
        :src="{{ person_expr }}.cover_url"
        alt=""
        class="w-8 h-8 rounded-full object-cover"
      />
    </template>
    <template x-if="!{{ person_expr }}.cover_url">
      <span
        class="flex w-8 h-8 items-center justify-center rounded-full bg-base-200 text-base-content/50"
      >
        <i data-lucide="contact" class="w-4 h-4"></i>
      </span>
    </template>
    <span class="flex-1 truncate" x-text="{{ person_expr }}.name"></span>
    <span
      class="text-xs text-base-content/60 tabular-nums"
      x-show="{{ person_expr }}.photo_count"
      x-text="photosCountLabels.photos({{ person_expr }}.photo_count)"
    ></span>
  </button>
</li>
