{% comment %}
  "This is...": who the picked faces of a board are. A contact from People,
  a new name, an unnamed person, or someone new with no name yet. State in
  faceSelectionMixin() (faces.js).
{% endcomment %}
<dialog id="face-assign-dialog" class="modal">
  <div class="modal-box max-w-md">
    <h3 class="font-bold text-lg flex items-center gap-2">
      <i data-lucide="user-round-pen" class="w-5 h-5 text-module"></i>
      <span
        x-text="selectedFaces.length === 1 ? 'Who is this?' : 'Who are these ' + selectedFaces.length + ' faces?'"
      ></span>
    </h3>
    <p class="text-sm text-base-content/60 mb-4">Pick a contact, or type a new name to add one to People.</p>

    <form @submit.prevent="canCreateAssign() && assignToNewPerson()">
      <label class="input input-bordered input-sm flex items-center gap-2 w-full">
        <i data-lucide="search" class="w-4 h-4 opacity-60"></i>
        <input
          type="text"
          class="grow"
          placeholder="Name"
          autocomplete="off"
          x-model="assignDialog.query"
          @input.debounce.250ms="searchAssign()"
        />
      </label>
    </form>

    <div x-show="assignDialog.loading" class="flex justify-center py-6">
      <span class="loading loading-spinner loading-md"></span>
    </div>

    <ul
      x-show="!assignDialog.loading"
      class="menu menu-sm p-0 mt-3 max-h-64 flex-nowrap overflow-y-auto"
    >
      <template x-for="person in assignDialog.results" :key="person.uuid">
        <li>
          <button type="button" class="gap-3 rounded" @click="assignToPerson(person)">
            <template x-if="person.cover_url">
              <img
                :src="person.cover_url"
                alt=""
                class="w-8 h-8 rounded-full object-cover"
              />
            </template>
            <template x-if="!person.cover_url">
              <span
                class="flex w-8 h-8 items-center justify-center rounded-full bg-base-200 text-base-content/50"
              >
                <i data-lucide="contact" class="w-4 h-4"></i>
              </span>
            </template>
            <span class="flex-1 truncate" x-text="person.name"></span>
            <span
              class="text-xs text-base-content/60 tabular-nums"
              x-show="person.photo_count"
              x-text="person.photo_count + (person.photo_count === 1 ? ' photo' : ' photos')"
            ></span>
          </button>
        </li>
      </template>
      <li x-show="canCreateAssign()" x-cloak>
        <button
          type="button"
          class="gap-3 rounded text-module"
          @click="assignToNewPerson()"
        >
          <span
            class="flex w-8 h-8 items-center justify-center rounded-full border-2 border-dashed border-current"
          >
            <i data-lucide="user-plus" class="w-4 h-4"></i>
          </span>
          <span class="flex-1 truncate">
            Add “<span x-text="assignDialog.query.trim()"></span>” to People
          </span>
        </button>
      </li>
    </ul>

    <div
      x-show="!assignDialog.loading && !assignDialog.query.trim()"
      class="mt-3"
    >
      <p
        class="px-1 pb-2 text-xs font-semibold uppercase tracking-wider text-base-content/60"
      >
        Not named yet
      </p>
      <div class="grid grid-cols-6 gap-2 max-h-48 overflow-y-auto p-1">
        <button
          type="button"
          class="flex aspect-square items-center justify-center rounded-full border-2 border-dashed border-base-content/30 text-base-content/60 hover:border-module hover:text-module focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-module"
          title="Someone new, no name yet"
          aria-label="Someone new, no name yet"
          @click="assignToSomeoneNew()"
        >
          <i data-lucide="user-plus" class="w-5 h-5"></i>
        </button>
        <template x-for="cluster in assignDialog.clusters" :key="cluster.uuid">
          <button
            type="button"
            class="aspect-square overflow-hidden rounded-full ring-offset-2 ring-offset-base-100 hover:ring-2 hover:ring-module focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-module"
            :title="cluster.photo_count + (cluster.photo_count === 1 ? ' photo' : ' photos')"
            :aria-label="'Unnamed person with ' + cluster.photo_count + ' photos'"
            @click="assignToCluster(cluster)"
          >
            <img :src="cluster.cover_url" alt="" class="w-full h-full object-cover" />
          </button>
        </template>
      </div>
    </div>

    <div class="modal-action">
      <button
        type="button"
        class="btn btn-ghost btn-sm"
        @click="closeAssignDialog()"
      >
        Cancel
      </button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button type="submit">close</button>
  </form>
</dialog>
