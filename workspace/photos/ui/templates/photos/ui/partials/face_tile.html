{% comment %}
  One face of a board, inside an x-for over `face` ({ uuid, crop_url, file,
  file_name, file_type, title? }). A click picks it; the corner button opens
  the photo it was found in. State in faceSelectionMixin() (faces.js).
{% endcomment %}
<div class="group relative aspect-square" :data-face-uuid="face.uuid">
  <button
    type="button"
    class="absolute inset-0 overflow-hidden rounded-lg bg-base-200 ring-2 ring-offset-1 ring-offset-base-100 transition focus-visible:outline-none"
    :class="isFaceSelected(face.uuid) ? 'ring-module' : 'ring-transparent hover:ring-module/50 focus-visible:ring-module'"
    :aria-pressed="isFaceSelected(face.uuid)"
    :title="face.title || ''"
    :aria-label="face.title || 'Face'"
    :disabled="faceBusy"
    @click="toggleFace(face.uuid, $event)"
  >
    <img
      :src="face.crop_url"
      alt=""
      class="w-full h-full object-cover transition"
      :class="{ 'scale-90 rounded-md': isFaceSelected(face.uuid) }"
      loading="lazy"
      draggable="false"
    />
  </button>
  <span
    x-show="isFaceSelected(face.uuid)"
    x-cloak
    class="pointer-events-none absolute top-1 left-1 rounded-full bg-module text-module-content p-0.5 shadow"
  >
    <i data-lucide="check" class="w-3.5 h-3.5"></i>
  </span>
  <button
    type="button"
    class="absolute bottom-1 right-1 btn btn-xs btn-circle bg-base-100/90 border-0 shadow opacity-0 group-hover:opacity-100 focus-visible:opacity-100 max-sm:opacity-100"
    title="Open the photo"
    aria-label="Open the photo"
    @click="openFacePhoto(face)"
  >
    <i data-lucide="image" class="w-3 h-3"></i>
  </button>
</div>
