{% load i18n %}
{# Always rendered, even empty: the poll after an import swaps it alone. #}
<span id="photos-pending" class="contents">
  {% if pending %}
    <span
      class="badge badge-ghost gap-1.5 max-sm:hidden"
      title="{% translate 'New photos and videos show up here once their capture date has been read.' %}"
      data-photos-pending
    >
      <span class="loading loading-spinner loading-xs"></span>
      {% blocktranslate trimmed count counter=pending %}
        {{ counter }} being analyzed
      {% plural %}
        {{ counter }} being analyzed
      {% endblocktranslate %}
    </span>
  {% endif %}
</span>
