{% comment %}
  The "To check" queue of the review page: per named person, the faces the
  grouping put with them without being sure. Marked faces are rejected, the
  others confirmed. State and actions in facesReview() (faces.js).
{% endcomment %}
<template x-if="doubts.length">
  <div class="w-full max-w-5xl mx-auto p-4 space-y-4">
    <p class="text-sm text-base-content/60">
      These faces were put with someone automatically, but look less like them than the rest. Click the ones that are someone else, then confirm.
    </p>
    <template x-for="block in doubts" :key="block.person.uuid">
      <section
        class="rounded-box border border-base-300 p-4"
        :aria-label="block.person.name"
      >
        <div class="flex flex-wrap items-center gap-3 mb-3">
          <a
            :href="block.person.url"
            x-target.push="photos-nav photos-content"
            class="flex items-center gap-3 min-w-0 hover:text-module"
          >
            <img
              :src="block.person.cover_url"
              alt=""
              class="w-10 h-10 rounded-full object-cover bg-base-200 shrink-0"
            />
            <span class="min-w-0">
              <span class="block font-semibold truncate" x-text="block.person.name"></span>
              <span
                class="block text-xs text-base-content/60 tabular-nums"
                x-text="block.total + (block.total === 1 ? ' face to check' : ' faces to check')"
              ></span>
            </span>
          </a>
          <button
            type="button"
            class="btn btn-module btn-sm ml-auto"
            :disabled="settling !== null"
            @click="settle(block)"
          >
            <span
              x-show="settling === block.person.uuid"
              x-cloak
              class="loading loading-spinner loading-xs"
            ></span>
            <span x-text="settleLabel(block)"></span>
          </button>
        </div>
        <div
          class="grid grid-cols-[repeat(auto-fill,minmax(4.5rem,1fr))] sm:grid-cols-[repeat(auto-fill,minmax(5.5rem,1fr))] gap-2"
        >
          <template x-for="face in block.faces" :key="face.uuid">
            <button
              type="button"
              class="relative aspect-square overflow-hidden rounded-lg bg-base-200 ring-2 ring-offset-1 ring-offset-base-100 transition focus-visible:outline-none"
              :class="isMarked(face) ? 'ring-error' : 'ring-transparent hover:ring-module/50 focus-visible:ring-module'"
              :aria-pressed="isMarked(face)"
              :title="isMarked(face) ? 'Not ' + block.person.name : block.person.name"
              :disabled="settling !== null"
              @click="toggleMark(face)"
            >
              <img
                :src="face.crop_url"
                alt=""
                class="w-full h-full object-cover transition"
                :class="{ 'opacity-40 grayscale': isMarked(face) }"
                loading="lazy"
                draggable="false"
              />
              <span
                x-show="isMarked(face)"
                x-cloak
                class="absolute inset-0 flex items-center justify-center"
              >
                <span class="rounded-full bg-error text-error-content p-1">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </span>
              </span>
            </button>
          </template>
        </div>
        <p
          x-show="block.total > block.faces.length"
          x-cloak
          class="mt-3 text-xs text-base-content/60"
          x-text="'The next ' + (block.total - block.faces.length) + ' come once these are confirmed.'"
        ></p>
      </section>
    </template>
  </div>
</template>

<template x-if="!doubts.length">
  <div
    class="flex flex-col items-center justify-center text-center gap-3 px-6 py-24"
  >
    <div class="rounded-full bg-module/10 p-5">
      <i data-lucide="user-check" class="w-10 h-10 text-module"></i>
    </div>
    <h2 class="text-lg font-semibold">Nothing to check</h2>
    <p class="text-sm text-base-content/60 max-w-sm">
      Faces the grouping is not sure of, among the people you named, show up here.
    </p>
  </div>
</template>
