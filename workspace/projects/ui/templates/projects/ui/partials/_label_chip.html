{% comment %}
Label chip
==========
Colored rounded pill for a label, sized like the user_chip partial. Two modes:

Alpine mode - chips rendered inside a `<template x-for>` (modal and panel
selections). Params are Alpine expression fragments evaluated in the caller's
loop scope (not Django values):
  - name_expr:   expression for the label name         (e.g. "labelName(id)")
  - style_expr:  expression for the inline color style (e.g. "labelStyle(id)")
  - remove_expr: optional - expression run on remove (e.g. "removeLabel(id)").
                 Omit for a read-only chip without a cross.

Server mode - static read-only chip for server-rendered lists (task cards,
backlog rows, overview). Used when name_expr is NOT passed:
  - label: Label instance or {name, color} dict (an enclosing "for label in"
           loop variable is picked up automatically via context inheritance)
  - class: optional extra classes on the pill (e.g. "shrink-0 hidden lg:inline-flex")
  - size:  "sm" for a compact pill (dense lists: board cards, backlog rows);
           omit for the default size matching the removable variant

The inner span's text-box trims the line box to the ink so flex centering is
optically exact. Browsers without it fall back to a whole-pixel nudge that
compensates the font's low baseline in the text-xs line box (fractional
offsets shimmer across browser zoom levels, so keep it integer).
{% endcomment %}
{% if name_expr %}
  <span class="inline-flex items-center gap-1 rounded-full border border-base-300 bg-base-100 text-xs py-0.5 pl-2.5 {% if remove_expr %}pr-1{% else %}pr-2.5{% endif %}"
        :style="{{ style_expr }}">
    <span class="relative -top-px [text-box:trim-both_cap_alphabetic] supports-[text-box:trim-both_cap_alphabetic]:top-0"
          x-text="{{ name_expr }}"></span>
    {% if remove_expr %}
      {% comment %}Inline SVG on purpose: lucide.createIcons() does not process
      nodes that Alpine clones out of an x-for template, so a data-lucide icon
      here would render blank.{% endcomment %}
      <button type="button" class="btn btn-ghost btn-circle btn-xs min-h-0 h-5 w-5 p-0"
              @click.stop="{{ remove_expr }}" :aria-label="'Remove ' + {{ name_expr }}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    {% endif %}
  </span>
{% else %}
  {# Default min-h matches the removable variant, whose height is set by its h-5 buttons. #}
  <span class="inline-flex items-center rounded-full border border-base-300 bg-base-100 {% if size == 'sm' %}text-[11px] px-2 py-px{% else %}text-xs py-0.5 px-2.5 min-h-[26px]{% endif %} {{ class|default:'' }}"
        {% if label.color %}style="border-color: {{ label.color }}; color: {{ label.color }}"{% endif %}>
    <span class="relative -top-px [text-box:trim-both_cap_alphabetic] supports-[text-box:trim-both_cap_alphabetic]:top-0">{{ label.name }}</span>
  </span>
{% endif %}
