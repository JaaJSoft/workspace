{% comment %}
Priority dropdown: styled replacement for the native <select>, visually in
line with the user/label pickers. The trigger shows the current priority with
its icon and colour (mirroring _priority_badge.html); the dropdown lists the
four priorities as menu rows.

Params:
  - model_expr: Alpine l-value holding the current priority slug (required),
                e.g. "form.priority" or "filters.priority". Resolved in the
                parent scope through Alpine's prototypal inheritance.
  - on_change:  optional Alpine statement run after the value is set,
                e.g. "applyFilters()".
  - with_all:   Django flag - prepend an "All priorities" empty-value row
                (filter bars, where the field is optional).
  - disabled:   Django flag - render the trigger disabled (permission gating).
  - label:      accessible field name, prepended to the trigger's visible value
                as screen-reader-only text (e.g. "Priority" -> "Priority Medium").

Every icon is static in the markup (x-show, never x-if) so it exists at
createIcons time.
{% endcomment %}
<div
  x-data="selectDropdown()"
  class="relative"
  @click.outside="open = false"
  @keydown.arrow-down.prevent="move(1)"
  @keydown.arrow-up.prevent="move(-1)"
  @keydown.escape="if (open) { $event.preventDefault(); closeAndFocus() }"
  @keydown.tab="open = false"
>
  <button
    type="button"
    class="input input-sm input-bordered flex items-center gap-2 w-full cursor-pointer text-left disabled:cursor-not-allowed"
    x-ref="trigger"
    aria-haspopup="menu"
    :aria-expanded="open"
    @click="toggle()"
    {% if disabled %}disabled{% endif %}
  >
    {% if label %}<span class="sr-only">{{ label }}</span>{% endif %}
    {% if with_all %}
      <span
        x-show="!{{ model_expr }}"
        x-cloak
        class="flex items-center gap-2 min-w-0"
      >
        <i data-lucide="flag" class="w-4 h-4 opacity-60 shrink-0"></i>
        <span class="truncate">All priorities</span>
      </span>
    {% endif %}
    <span
      x-show="{{ model_expr }} === 'urgent'"
      x-cloak
      class="flex items-center gap-2 min-w-0"
    >
      <i data-lucide="flame" class="w-4 h-4 text-error shrink-0"></i>
      <span class="truncate">Urgent</span>
    </span>
    <span
      x-show="{{ model_expr }} === 'high'"
      x-cloak
      class="flex items-center gap-2 min-w-0"
    >
      <i data-lucide="arrow-up" class="w-4 h-4 text-warning shrink-0"></i>
      <span class="truncate">High</span>
    </span>
    <span
      x-show="{{ model_expr }} === 'medium'"
      x-cloak
      class="flex items-center gap-2 min-w-0"
    >
      <i data-lucide="equal" class="w-4 h-4 text-info shrink-0"></i>
      <span class="truncate">Medium</span>
    </span>
    <span
      x-show="{{ model_expr }} === 'low'"
      x-cloak
      class="flex items-center gap-2 min-w-0"
    >
      <i data-lucide="arrow-down" class="w-4 h-4 opacity-60 shrink-0"></i>
      <span class="truncate">Low</span>
    </span>
    <i
      data-lucide="chevron-down"
      class="w-3.5 h-3.5 opacity-60 ml-auto shrink-0"
    ></i>
  </button>
  <div
    x-show="open"
    x-cloak
    class="absolute z-50 mt-1 w-full min-w-40 bg-base-100 border border-base-300 rounded-lg shadow-lg"
  >
    <ul class="menu menu-sm p-1" role="menu">
      {% if with_all %}
        <li role="none">
          <button
            type="button"
            class="flex items-center gap-2 rounded"
            :class="!{{ model_expr }} ? 'active' : ''"
            role="menuitemradio"
            :aria-checked="!{{ model_expr }}"
            @click="{{ model_expr }} = ''; open = false; {{ on_change|default:'' }}"
          >
            <i data-lucide="flag" class="w-4 h-4 opacity-60"></i>
            <span class="text-sm">All priorities</span>
          </button>
        </li>
      {% endif %}
      <li role="none">
        <button
          type="button"
          class="flex items-center gap-2 rounded"
          :class="{{ model_expr }} === 'urgent' ? 'active' : ''"
          role="menuitemradio"
          :aria-checked="{{ model_expr }} === 'urgent'"
          @click="{{ model_expr }} = 'urgent'; open = false; {{ on_change|default:'' }}"
        >
          <i data-lucide="flame" class="w-4 h-4 text-error"></i>
          <span class="text-sm">Urgent</span>
        </button>
      </li>
      <li role="none">
        <button
          type="button"
          class="flex items-center gap-2 rounded"
          :class="{{ model_expr }} === 'high' ? 'active' : ''"
          role="menuitemradio"
          :aria-checked="{{ model_expr }} === 'high'"
          @click="{{ model_expr }} = 'high'; open = false; {{ on_change|default:'' }}"
        >
          <i data-lucide="arrow-up" class="w-4 h-4 text-warning"></i>
          <span class="text-sm">High</span>
        </button>
      </li>
      <li role="none">
        <button
          type="button"
          class="flex items-center gap-2 rounded"
          :class="{{ model_expr }} === 'medium' ? 'active' : ''"
          role="menuitemradio"
          :aria-checked="{{ model_expr }} === 'medium'"
          @click="{{ model_expr }} = 'medium'; open = false; {{ on_change|default:'' }}"
        >
          <i data-lucide="equal" class="w-4 h-4 text-info"></i>
          <span class="text-sm">Medium</span>
        </button>
      </li>
      <li role="none">
        <button
          type="button"
          class="flex items-center gap-2 rounded"
          :class="{{ model_expr }} === 'low' ? 'active' : ''"
          role="menuitemradio"
          :aria-checked="{{ model_expr }} === 'low'"
          @click="{{ model_expr }} = 'low'; open = false; {{ on_change|default:'' }}"
        >
          <i data-lucide="arrow-down" class="w-4 h-4 opacity-60"></i>
          <span class="text-sm">Low</span>
        </button>
      </li>
    </ul>
  </div>
</div>
