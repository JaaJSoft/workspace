{% comment %}
  Search, filter, sort and the list/mosaic switch. Every control writes to the
  store, which decides what is shown; nothing here queries the server, because
  a name is a ciphertext there and no WHERE clause could match one.
{% endcomment %}
<div class="flex items-center gap-2 mt-3 flex-wrap">
  <label class="input input-sm input-bordered flex items-center gap-2 w-64">
    <i data-lucide="search" class="w-4 h-4 opacity-50"></i>
    <input
      type="search"
      class="grow"
      placeholder="Filter by name"
      x-model.debounce.200ms="search"
      autocomplete="off"
      spellcheck="false"
    />
  </label>

  <select
    class="select select-sm select-bordered"
    x-model="typeFilter"
    aria-label="Show"
  >
    <option value="all">Everything</option>
    <option value="folders">Folders</option>
    <option value="entries">Entries</option>
    <option value="favorites">Favorites</option>
  </select>

  <div class="join">
    <select
      class="select select-sm select-bordered join-item"
      x-model="sortField"
      aria-label="Sort by"
    >
      <option value="default">Sort: default</option>
      <option value="name">Name</option>
      <option value="favorite">Favorite</option>
      <option value="modified">Modified</option>
    </select>
    <button
      type="button"
      class="btn btn-sm btn-outline join-item"
      :disabled="sortField === 'default'"
      @click="toggleSortDir()"
      :aria-label="sortDir === 'asc' ? 'Sort ascending' : 'Sort descending'"
    >
      <i data-lucide="arrow-up" class="w-4 h-4" x-show="sortDir === 'asc'"></i>
      <i
        data-lucide="arrow-down"
        class="w-4 h-4"
        x-show="sortDir === 'desc'"
        x-cloak
      ></i>
    </button>
  </div>

  <button
    type="button"
    class="btn btn-sm btn-ghost"
    x-show="filtering()"
    @click="resetAll()"
  >
    Reset
  </button>

  <div class="join ml-auto">
    <button
      type="button"
      class="btn btn-sm btn-outline join-item"
      :class="viewMode === 'list' ? 'bg-error/10 text-error' : ''"
      @click="setViewMode('list')"
      aria-label="List view"
    >
      <i data-lucide="list" class="w-4 h-4"></i>
    </button>
    <button
      type="button"
      class="btn btn-sm btn-outline join-item"
      :class="viewMode === 'mosaic' ? 'bg-error/10 text-error' : ''"
      @click="setViewMode('mosaic')"
      aria-label="Mosaic view"
    >
      <i data-lucide="grid-2x2" class="w-4 h-4"></i>
    </button>
  </div>
</div>
