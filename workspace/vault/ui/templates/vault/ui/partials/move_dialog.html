{% comment %}
  Choosing the folder a selection goes to. Mounted under x-if so every opening
  starts with nothing chosen. Escape listens on the window: a click on a row
  can leave focus on the body, where a listener on the box would not hear it.
{% endcomment %}
<template x-if="moveDialog">
  <div class="modal modal-open">
    <div
      class="modal-box max-w-md"
      x-trap="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="vault-move-dialog-title"
      @keydown.escape.window="closeMoveDialog()"
    >
      {% include "ui/partials/dialog_header.html" with icon="folder-input" title_expr="'Move ' + (moveDialog.uuids.length === 1 ? ((entries.find((e) => e.uuid === moveDialog.uuids[0]) || {}).name || '') : moveDialog.uuids.length + ' entries')" title_id="vault-move-dialog-title" subtitle_expr="moveDialog.uuids.length > 1 ? 'Choose where they go in this vault.' : 'Choose where it goes in this vault.'" close_expr="closeMoveDialog()" only %}

      <ul
        class="menu bg-base-200/50 rounded-box max-h-72 overflow-y-auto flex-nowrap"
      >
        <li>
          <a
            :class="{ active: moveDialog.target === null }"
            @click="moveDialog.target = null"
          >
            <i
              :data-lucide="openVault ? (openVault.icon || 'lock') : 'lock'"
              class="w-4 h-4"
            ></i>
            <span x-text="vaultName()"></span>
            <span class="text-xs opacity-50">no folder</span>
            <span
              class="badge badge-xs badge-ghost ml-auto"
              x-show="commonFolder(moveDialog.uuids) === null"
            >here now</span>
          </a>
        </li>
        <template x-for="folder in folderTree()" :key="folder.uuid">
          <li>
            <a
              :class="{ active: moveDialog.target === folder.uuid }"
              :style="{ paddingLeft: (0.75 + 1.25 * (folder.depth + 1)) + 'rem' }"
              @click="moveDialog.target = folder.uuid"
            >
              <i data-lucide="folder" class="w-4 h-4 text-warning"></i>
              <span x-text="folder.name"></span>
              <span
                class="badge badge-xs badge-ghost ml-auto"
                x-show="commonFolder(moveDialog.uuids) === folder.uuid"
              >here now</span>
            </a>
          </li>
        </template>
      </ul>

      <div class="modal-action">
        <button type="button" class="btn btn-sm btn-ghost" @click="closeMoveDialog()">Cancel</button>
        <button
          type="button"
          class="btn btn-sm btn-module"
          :disabled="!canConfirmMove()"
          @click="confirmMove()"
        >
          Move
        </button>
      </div>
    </div>
    <div class="modal-backdrop" @click="closeMoveDialog()"></div>
  </div>
</template>
